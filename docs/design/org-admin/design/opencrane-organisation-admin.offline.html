  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

tus before you try again. Reference <span style=\"font-family:'DM Mono',monospace\">chg_7F3K<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"display:flex;justify-content:flex-end\"><button style=\"background:#0db5cc;color:#16191a;border:1px solid #0db5cc;box-shadow:0 1px 0 #0a8497;border-radius:8px;padding:8px 14px;font:500 13px 'DM Sans',sans-serif;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;min-height:36px\" style-hover=\"background:#22c3d8\" style-active=\"transform:translateY(1px)\" style-focus=\"outline:2px solid #0a8497;outline-offset:2px\">Check status<\u002Fbutton><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><sc-if value=\"{{ showNotes }}\" hint-placeholder-val=\"{{ true }}\"><ol style=\"list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px 22px;padding:14px 2px 0\"><li style=\"display:flex;gap:9px;font-size:12.5px;line-height:1.55;color:#4f575a;text-wrap:pretty\"><span style=\"width:18px;height:18px;border-radius:50%;background:#fff3e8;color:#b35510;font:700 10px/18px 'DM Sans',sans-serif;text-align:center;flex-shrink:0\">1<\u002Fspan><span>The reference is pixel-identical to the idle row, so saving shows nothing. A busy row must look busy and name the step it is on.<\u002Fspan><\u002Fli><li style=\"display:flex;gap:9px;font-size:12.5px;line-height:1.55;color:#4f575a;text-wrap:pretty\"><span style=\"width:18px;height:18px;border-radius:50%;background:#fff3e8;color:#b35510;font:700 10px/18px 'DM Sans',sans-serif;text-align:center;flex-shrink:0\">2<\u002Fspan><span>Keep progress scoped to this provider. Other rows stay usable (per-row concurrency).<\u002Fspan><\u002Fli><li style=\"display:flex;gap:9px;font-size:12.5px;line-height:1.55;color:#4f575a;text-wrap:pretty\"><span style=\"width:18px;height:18px;border-radius:50%;background:#fff3e8;color:#b35510;font:700 10px/18px 'DM Sans',sans-serif;text-align:center;flex-shrink:0\">3<\u002Fspan><span>Keep the server's lor:#b35510;font:700 10px/18px 'DM Sans',sans-serif;text-align:center;flex-shrink:0\">4<\u002Fspan><span>\"Install\" becomes \"Review and add\", which leads into the MCP setup (<a href=\"#4b\">4b<\u002Fa>).<\u002Fspan><\u002Fli><\u002Fol><\u002Fsc-if><\u002Fdiv><div id=\"1g\" style=\"width:1180px;max-width:100%;flex:none;display:flex;flex-direction:column;gap:10px\"><div style=\"display:flex;align-items:baseline;gap:9px;flex-wrap:wrap\"><a href=\"#1g\" style=\"font:600 10.5px 'DM Mono',monospace;padding:3px 7px;background:rgba(0,0,0,.08);color:#16191a;border-radius:5px\">1g<\u002Fa><span style=\"font-size:14px;font-weight:600;color:#16191a\">Installed MCP server — needs connection<\u002Fspan><span style=\"flex:1\"><\u002Fspan><span style=\"font-size:11.5px;font-weight:600;color:#c1392b\">Fix<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:16px\"><div style=\"display:flex;flex-direction:column;gap:6px\"><div style=\"font:600 10.5px 'DM Sans',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#6f7779\">Before — Storybook reference<\u002Fdiv><div style=\"border:1px dashed #c9d1d2;border-radius:8px;padding:8px;background:#fff\"><img src=\"3462df82-f6fb-4e81-aac9-6c1c1ecbc4be\" alt=\"Original: tools-installed-row--needs-credential.png\" style=\"display:block;width:100%;max-width:100%;height:auto\"><\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px\"><div style=\"font:600 10.5px 'DM Sans',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#6f7779\">Corrected<\u002Fdiv><div style=\"background:#fff;border:1px solid #d9dfe0;border-radius:12px;\"><div role=\"row\" style=\"display:grid;grid-template-columns:minmax(0,1.3fr) repeat(4,minmax(0,1fr)) auto;gap:16px;padding:10px 18px;background:#f1f4f4;border-bottom:1px solid #e1e6e7;font:600 10.5px 'DM Sans',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#6f7779\"><span>MCP server<\u002Fspan><span>Installed<\u002Fspan><span>Connected<\u002F 2.5 6.3l2.3 2.3L9.5 3.6\"><\u002Fpath><\u002Fsvg><span>Installed<\u002Fspan><\u002Fspan><\u002Fdiv><span style=\"font-size:12px;color:#6f7779\">as of 09:40<\u002Fspan><\u002Fdiv><div role=\"row\" style=\"display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) auto;gap:16px;padding:14px 18px;align-items:center;\" style-hover=\"background:#fafbfb\"><div style=\"min-width:0\"><div style=\"font-size:13.5px;font-weight:600;color:#16191a;overflow-wrap:anywhere\">Microsoft 365<\u002Fdiv><div style=\"font-size:12px;color:#6f7779;margin-top:2px;overflow-wrap:anywhere\">MCP server<\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:3px;min-width:0\"><span style=\"display:inline-flex;align-items:center;gap:7px;flex-wrap:nowrap;max-width:100%;font-size:12.5px;font-weight:500;color:#2a7d4f;line-height:1.35\"><svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 12 12\" fill=\"none\" stroke=\"#2a7d4f\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink:0\"><path d=\"M2.5 6.3l2.3 2.3L9.5 3.6\"><\u002Fpath><\u002Fsvg><span>Installed<\u002Fspan><\u002Fspan><\u002Fdiv><span style=\"font-size:12px;color:#6f7779\">as of 09:40<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><sc-if value=\"{{ showNotes }}\" hint-placeholder-val=\"{{ true }}\"><ol style=\"list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px 22px;padding:14px 2px 0\"><li style=\"display:flex;gap:9px;font-size:12.5px;line-height:1.55;color:#4f575a;text-wrap:pretty\"><span style=\"width:18px;height:18px;border-radius:50%;background:#fff3e8;color:#b35510;font:700 10px/18px 'DM Sans',sans-serif;text-align:center;flex-shrink:0\">1<\u002Fspan><span>\"Loading…\" floats above the old error. Progress replaces the notice in the same place, and the error disappears while retrying.<\u002Fspan><\u002Fli><li style=\"display:flex;gap:9px;font-size:12.5px;line-height:1.55;color:#4f575a;text-wrap:pretty\"><span style=\"width:18px;height:18px;border-radius:50%;background:#fff3e8;color:#b35510;font:700 10px/18px 'DM Sans',sans-serif;text-align:center;flex-shrink:0\">2<\u002Fspan><span>The faded cyan button fails contrast. The disabled state keeps a readable label that says what is happening.<\u002Fspan><\u002Fli><li style=\"display:flex;gap:9px;font-size:12.5px;line-height:1.55;color:#4f575a;text-wrap:pretty\"><span style=\"width:18px;height:18px;border-radius:50%;background:#fff3e8;color:#b35510;font:700 10px/18px 'DM Sans',sans-serif;text-align:center;flex-shrink:0\">3<\u002Fspan><span>Announce \"Refreshing\" and the result through aria-live. Keep focus on the button.<\u002Fspan><\u002Fli><\u002Fol><\u002Fsc-if><\u002Fdiv><div id=\"1k\" style=\"width:1180px;max-width:100%;flex:none;display:flex;flex-direction:column;gap:10px\"><div style=\"display:flex;align-items:baseline;gap:9px;flex-wrap:wrap\"><a href=\"#1k\" style=\"font:600 10.5px 'DM Mono',monospace;padding:3px 7px;background:rgba(0,0,0,.08);color:#16191a;border-radius:5px\">1k<\u002Fa><span style=\"font-size:14px;font-weight:600;color:#16191a\">Explain the system before its details<\u002Fspan><span style=\"flex:1\"><\u002Fspan><span style=\"font-size:11.5px;font-weight:600;color:#0a8497\">Borrow<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:16px\"><div style=\"display:flex;flex-direction:column;gap:6px\"><div style=\"font:600 10.5px 'DM Sans',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#6f7779\">Before — Storybook reference<\u002Fdiv><div style=\"border:1px dashed #c9d1d2;border-radius:8px;padding:8px;background:#fff\"><img src=\"7e6ad881-9778-4e67-86e8-2d776585ed46\" alt=\"Original: oc8-architecture-overview.jpg\" style=\"display:block;width:640px;max-width:100%;height:auto\"><\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px\"><div style=\"font:600 10.5px 'DM Sans',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#6f7779\">Corrected<\u002Fdiv><div style=\"background:#f6f8f8;border:1px solid #d9dfe0;border-radius:12px;padding:22px 24px;display:flex;flex-direction:column;gap:16px\"><div><div style=\"font-size:16px;font-weight:600\">How Kijani Supplies is set up<\u002Fdiv><div style=\"font-size:13px;color:#4f575a;margin-top:4px;max-width:640px;text-wrap:pretty\">Your assistants use the models you connect, reach company systems through MCP servers you approve, and follow skills your people share, and act only for the people you allow.<\u002Fdiv><\u002Fdiv><div style=\"border:1.5px dashed #9fdde8;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px\"><div style=\"font-size:11.5px;font-weight:600;color:#0a8497\">Inside your organisation<\u002Fdiv><div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px\"><div style=\"background:#fff;border:1px solid #d9dfe0;border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;\"><div style=\"font-size:14px;font-weight:600\">Models &amp; providers<\u002Fdiv><div style=\"font-size:12px;color:#0a8497;font-weight:500\">Managed by admins<\u002Fdiv><div style=\"font-size:12.5px;line-height:1.5;color:#4f575a\">OpenCrane stores keys; nobody can read them back.<\u002Fdiv><div style=\"font-size:12.5px;line-height:1.5;color:#4f575a\">Prompts go to the provider you choose.<\u002Fdiv><\u002Fdiv><div style=\"background:#fff;border:1px solid #d9dfe0;border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;\"><div style=\"font-size:14px;font-weight:600\">Integrations<\u002Fdiv><div style=\"font-size:12px;color:#0a8497;font-weight:500\">Admins approve · people connect<\u002Fdiv><div style=\"font-size:12.5px;line-height:1.5;color:#4f575a\">A company account, or each person's own.<\u002Fdiv><div style=\"font-size:12.5px;line-height:1.5;color:#4f575a\">Access is granted per group.<\u002Fdiv><\u002Fdiv><div style=\"background:#fff;border:1px solid #d9dfe0;border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;\"><div style=\"font-size:14px;font-weight:600\">People &amp; groups<\u002Fdiv><div style=\"font-size:12px;color:#0a8497;font-weight:500\">Your identity provider or OpenCrane<\u002Fdiv><div style=\"font-size:12.5px;line-height:1.5;color:#4f575a\">Roles decide who can change settings.<\u002Fdiv><div style=\"font-size:12.5px;line-height:1.5;color:#4f575a\">Groups decide who can use what.<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px\"><div style=\"background:#fff;border:1px solid #d9dfe0;border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;background:#fbfcfc\"><div style=\"font-size:14px;font-weight:600\">Assistants<\u002Fdiv><div style=\"font-size:12px;color:#0a8497;font-weight:500\">Run for one person at a time<\u002Fdiv><div style=\"font-size:12.5px;line-height:1.5;color:#4f575a\">Each run gets a temporary workspace that is cleared afterwards.<\u002Fdiv><\u002Fdiv><div style=\"background:#fff;border:1px solid #d9dfe0;border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;background:#fbfcfc\"><div style=\"font-size:14px;font-weight:600\">Change history<\u002Fdiv><div style=\"font-size:12px;color:#0a8497;font-weight:500\">Kept for every change<\u002Fdiv><div style=\"font-size:12.5px;line-height:1.5;color:#4f575a\">Who changed what, the outcome, and anything unfinished.<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><sc-if value=\"{{ showNotes }}\" hint-placeholder-val=\"{{ true }}\"><ol style=\"list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px 22px;padding:14px 2px 0\"><li style=\"display:flex;gap:9px;font-size:12.5px;line-height:1.55;color:#4f575a;text-wrap:pretty\"><span style=\"width:18px;height:18px;border-radius:50%;background:#fff3e8;color:#b35510;font:700 10px/18px 'DM Sans',sans-serif;text-align:center;flex-shrink:0\">1<\u002Fspan><span>Borrow OC8's order: a one-line introduction, then named parts with a clear job each, then detail.<\u002Fspan><\u002Fli><li style=\"display:flex;gap:9px;font-size:12.5px;line-height:1.55;color:#4f575a;text-wrap:pretty\"><span style=\"width:18px;height:18px;border-radius:50%;background:#fff3e8;color:#b35510;font:700 10px/18px 'DM Sans',sans-serif;text-align:center;flex-shrink:0\">2<\u002Fspan><span>Name the authority for each part (who manages it) and put the organisation boundary around what the admin controls.<\u002Fspan><\u002Fli><li style=\"display:flex;gap:9px;font-size:12.5px;line-height:1.55;color:#4f575a;text-wrap:pretty\"><span style=\"width:18px;height:18px;border-radius:50%;background:#fff3e8;color:#b35510;font:700 10px/18px 'DM Sans',sans-serif;text-align:center;flex-shrink:0\">3<\u002Fspan><span>This lives on Overview under \"How this works\" (<a href=\"#2b\">2b<\u002Fa>), in the admin's words rather than service names.<\u002Fspan><\u002Fli><\u002Fol><\u002Fsc-if><\u002Fdiv><\u002Fdiv><\u002Fsection>\n<section id=\"s2\" data-screen-label=\"02 Navigation and overview\" style=\"padding:48px 48px 56px;border-bottom:1px solid #dde2e3\"><div style=\"max-width:880px;margin-bottom:26px\"><div style=\"font:500 11px 'DM Mono',monospace;color:#0a8497;margin-bottom:6px\">02<\u002Fdiv><h2 style=\"font-size:24px;font-weight:600;letter-spacing:-.3px;color:#16191a;margin-bottom:8px\">Navigation and overview<\u002Fh2><p style=\"font-size:14px;line-height:1.6;color:#4f575a;text-wrap:pretty\">Five destinations under Organisation settings. The overview is where interrupted work is picked up.<\u002Fp><\u002Fdiv><div style=\"display:flex;flex-wrap:wrap;gap:40px;align-items:flex-start\"><div id=\"2a\" style=\"width:420px;max-width:100%;flex:none;display:flex;flex-direction:column;gap:10px\"><div style=\"display:flex;align-items:baseline;gap:9px;flex-wrap:wrap\"><a href=\"#2a\" style=\"font:600 10.5px 'DM Mono',monospace;padding:3px 7px;background:r "><svg width=\"11\" height=\"11\" sc-camel-view-box=\"0 0 12 12\" fill=\"none\" stroke=\"#c1392b\" stroke-width=\"2\" stroke-linecap=\"round\" style=\"flex-shrink:0\"><path d=\"M3 3l6 6M9 3l-6 6\"><\u002Fpath><\u002Fsvg><span>Couldn't reach OpenAI. Nothing changed.<\u002Fspan><\u002Fspan><span style=\"font-size:13px;color:#4f575a\">The reason, and whether anything changed<\u002Fspan><span style=\"font-size:13px;color:#0a8497;font-weight:500\">Try the same change again<\u002Fspan><\u002Fdiv><div role=\"row\" style=\"display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.4fr) minmax(0,1.6fr) minmax(0,1fr);gap:16px;padding:14px 18px;align-items:center;border-bottom:1px solid #e1e6e7;\" style-hover=\"background:#fafbfb\"><span style=\"font-size:13.5px;font-weight:600\">Outcome unknown<\u002Fspan><span style=\"display:inline-flex;align-items:center;gap:7px;flex-wrap:nowrap;max-width:100%;font-size:12.5px;font-weight:500;color:#4f575a;line-height:1.35\"><span style=\"width:12px;height:12px;border-radius:50%;border:1.5px solid #6f7779;color:#6f7779;font:700 8px/9px 'DM Sans',sans-serif;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0\">?<\u002Fspan><span>We couldn't confirm the change<\u002Fspan><\u002Fspan><span style=\"font-size:13px;color:#4f575a\">That the system can't confirm the effect yet<\u002Fspan><span style=\"font-size:13px;color:#0a8497;font-weight:500\">Check status<\u002Fspan><\u002Fdiv><div role=\"row\" style=\"display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.4fr) minmax(0,1.6fr) minmax(0,1fr);gap:16px;padding:14px 18px;align-items:center;border-bottom:1px solid #e1e6e7;\" style-hover=\"background:#fafbfb\"><span style=\"font-size:13.5px;font-weight:600\">Access changed<\u002Fspan><span style=\"display:inline-flex;align-items:center;gap:7px;flex-wrap:nowrap;max-width:100%;font-size:12.5px;font-weight:500;color:#6f7779;line-height:1.35\"><svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"#6f7779\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink:0\"><rect x=\"3\" y=\"7\" width=\"10\" height=\"7\" rx=\"1.5\"><\u002Frect><path d=\"M5.5 7V5a2.5 2.5 0 0 1 5 0v2\"><\u002Fpath><\u002Fsvg><span>You no longer have permission<\u002Fspan><\u002Fspan><span style=\"font-size:13px;color:#4f575a\">Protected details cleared; the next legitimate step<\u002Fspan><span style=\"font-size:13px;color:#0a8497;font-weight:500\">Ask an admin<\u002Fspan><\u002Fdiv><div role=\"row\" style=\"display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.4fr) minmax(0,1.6fr) minmax(0,1fr);gap:16px;padding:14px 18px;align-items:center;\" style-hover=\"background:#fafbfb\"><span style=\"font-size:13.5px;font-weight:600\">Disabled / removed<\u002Fspan><span style=\"display:inline-flex;align-items:center;gap:7px;flex-wrap:nowrap;max-width:100%;font-size:12.5px;font-weight:500;color:#6f7779;line-height:1.35\"><span style=\"width:10px;height:2px;border-radius:1px;background:#a7aeaf;flex-shrink:0\"><\u002Fspan><span>Removed 12 Sep · history kept<\u002Fspan><\u002Fspan><span style=\"font-size:13px;color:#4f575a\">What stopped and what history remains<\u002Fspan><span style=\"font-size:13px;color:#0a8497;font-weight:500\">Set up again<\u002Fspan><\u002Fdiv><\u002Fdiv><sc-if value=\"{{ showNotes }}\" hint-placeholder-val=\"{{ true }}\"><ol style=\"list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px 22px;padding:14px 2px 0\"><li style=\"display:flex;gap:9px;font-size:12.5px;line-height:1.55;color:#4f575a;text-wrap:pretty\"><span style=\"width:18px;height:18px;border-radius:50%;background:#fff3e8;color:#b35510;font:700 10px/18px 'DM Sans',sans-serif;text-align:center;flex-shrink:0\">1<\u002Fspan><span>Each state has its own glyph plus words, so meaning never depends on colour. The same glyphs are used in providers, integrations and people.<\u002Fspan><\u002Fli><li style=\"display:flex;gap:9px;font-size:12.5px;line-height:1.55;color:#4f575a;text-wrap:pretty\"><span style=\"width:18px;height:18px;border-radius:50%;background:#fff3e8;color:#b35510;font:700 10px/18px 'DM Sans',sans-serif;text-align:center;flex-shrink:0\">2<\u002Fspan><span>Only a failure that changed nothing offers \"Try again\", and it repeats the exact same change. Outcome unknown always reconciles first.<\u002Fspan><\u002Fli><li style=\"display:flex;gap:9px;font-size:12.5px;line-height:1.55;color:#4f575a;text-wrap:pretty\"><span style=\"width:18px;height:18px;border-radius:50%;background:#fff3e8;color:#b35510;font:700 10px/18px 'DM Sans',sans-serif;text-align:center;flex-shrink:0\">3<\u002Fspan><span>Put validation next to the field, status next to the affected row, and success only after the server confirms it.<\u002Fspan><\u002Fli><\u002Fol><\u002Fsc-if><\u002Fdiv><\u002Fdiv><\u002Fsection>\n<\u002Fdiv>\n<\u002Fx-dc>\n\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showNotes&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nclass Component extends DCLogic {\n  state = { step: 0, prov: 'Oai', name: 'OpenAI — Kijani Supplies', key: '', phase: 'idle', mA: false, mB: true, mC: false, def: 'Keep', aud: 'Grp', tested: false };\n  timers = [];\n  componentWillUnmount() { this.timers.forEach(clearTimeout); }\n  later(ms, f) { this.timers.push(setTimeout(f, ms)); }\n  startSave() {\n    this.setState({ phase: 'saving' });\n    this.later(1400, () => { if (this.state.phase === 'saving') { this.setState({ phase: 'reach', key: '' }); this.later(1300, () => { if (this.state.phase === 'reach') this.setState({ phase: 'offer' }); }); } });\n  }\n  renderVals() {\n    const s = this.state, P = { Oai: 'OpenAI', Goo: 'Google' }[s.prov];\n    const labels = ['Provider', 'API key', 'Verify', 'Models', 'Access', 'Done'];\n    const steps = labels.map((l, i) => ({ label: l, mark: i < s.step ? '✓' : String(i + 1), current: i === s.step ? 'step' : 'false',\n      bg: i === s.step ? '#fff' : 'transparent', dotBg: i < s.step ? '#e0f0e8' : i === s.step ? '#0db5cc' : '#fff',\n      dotColor: i < s.step ? '#2a7d4f' : '#16191a', dotBorder: i < s.step ? '1px solid #bfdccd' : i === s.step ? '1px solid #0db5cc' : '1px solid #c9d0d1',\n      color: i <= s.step ? '#16191a' : '#6f7779', weight: i === s.step ? 600 : 400 }));\n    const ph = s.phase;\n    const e = (label, detail, k) => ({ label, detail, ok: k === 'ok', work: k === 'work', todo: k === 'todo', unk: k === 'unk' });\n    const evidence = [\n      ph === 'unknown' ? e('Key stored', 'Unconfirmed — checking with the server is safe', 'unk') : ph === 'reconcile' ? e('Key stored', 'Checking change chg_7F3K…', 'work') : ph === 'saving' ? e('Key stored', 'Saving to OpenCrane…', 'work') : ph === 'idle' ? e('Key stored', 'Waiting to start', 'todo') : e('Key stored', 'Saved just now. You will not see it again.', 'ok'),\n      ['reach'].includes(ph) ? e(P + ' reachable', 'Asking ' + P + ' to accept the key…', 'work') : ['offer','test','done','skipped'].includes(ph) ? e(P + ' reachable', P + ' accepted the key just now', 'ok') : e(P + ' reachable', 'After the key is stored', 'todo'),\n      ph === 'test' ? e('A model answers', 'Sending one short test prompt…', 'work') : ph === 'done' ? e('A model answers', 'GPT‑4.1 mini replied in 0.8 s', 'ok') : ph === 'skipped' ? e('A model answers', 'Not tested. Shown as “connected, not tested”.', 'todo') : e('A model answers', 'Optional test prompt — explained before it runs', 'todo')\n    ];\n    const modelsSel = [s.mA && 'GPT‑4.1', s.mB && 'GPT‑4.1 mini', s.mC && 'o4-mini'].filter(Boolean);\n    const verified = ['done', 'skipped'].includes(ph);\n    const keyOk = s.key.trim().length >= 20;\n    const nextDisabled = (s.step === 1 && !keyOk) || (s.step === 2 && !verified) || (s.step === 3 && !modelsSel.length);\n    const nextLabel = ['Continue', 'Save and verify', 'Continue', 'Continue', 'Finish', 'Start over'][s.step];\n    const audienceText = s.aud === 'All' ? 'everyone in Kijani Supplies — 14 people.' : 'Sales team — 12 people. The other 2 won\\'t see these models.';\n    return {\n      showNotes: this.props.showNotes ?? true,\n      steps, evidence, provName: P, connName: s.name, key: s.key,\n      s0: s.step === 0, s1: s.step === 1, s2: s.step === 2, s3: s.step === 3, s4: s.step === 4, s5: s.step === 5,\n      borderAnth: '1px solid #e1e6e7', borderOai: s.prov === 'Oai' ? '2px solid #0a8497' : '1px solid #d3d9da', borderGoo: s.prov === 'Goo' ? '2px solid #0a8497' : '1px solid #d3d9da',\n      pickAnth: () => {}, pickOai: () => this.setState({ prov: 'Oai', name: 'OpenAI — Kijani Supplies' }), pickGoo: () => this.setState({ prov: 'Goo', name: 'Google — Kijani Supplies' }),\n      onName: ev => this.setState({ name: ev.target.value }), onKey: ev => this.setState({ key: ev.target.value }),\n      keyShort: s.key.length > 0 && !keyOk,\n      showUnknown: ph === 'unknown', showTestOffer: ph === 'offer', canSimulate: ph === 'saving',\n      simulateReload: () => this.setState({ phase: 'unknown', key: '' }),\n      reconcile: () => { this.setState({ phase: 'reconcile' }); this.later(1200, () => { this.setState({ phase: 'reach' }); this.later(1100, () => this.setState({ phase: 'offer' })); }); },\n      runTest: () => { this.setState({ phase: 'test' }); this.later(1500, () => this.setState({ phase: 'done' })); },\n      skipTest: () => this.setState({ phase: 'skipped' }),\n      mA: s.mA, mB: s.mB, mC: s.mC,\n      togA: () => this.setState({ mA: !s.mA }), togB: () => this.setState({ mB: !s.mB }), togC: () => this.setState({ mC: !s.mC }),\n      defKeep: s.def === 'Keep', defNew: s.def === 'New', setdefKeep: () => this.setState({ def: 'Keep' }), setdefNew: () => this.setState({ def: 'New' }),\n      audAll: s.aud === 'All', audGrp: s.aud === 'Grp', setaudAll: () => this.setState({ aud: 'All' }), setaudGrp: () => this.setState({ aud: 'Grp' }),\n      audienceText, modelsText: modelsSel.join(', ') || 'none',\n      defaultText: s.def === 'Keep' ? 'Claude Sonnet 4.6 (unchanged)' : 'GPT‑4.1 mini, for new conversations',\n      verifiedText: ph === 'done' ? 'key stored, provider reached, model answered — just now' : 'key stored and provider reached — model not tested',\n      canBack: s.step > 0 && s.step < 5, back: () => this.setState({ step: s.step - 1 }),\n      footNote: s.step === 2 && !verified ? 'Continue once the checks finish' : '',\n      nextDisabled, nextBg: nextDisabled ? '#e3e8e9' : '#0db5cc', nextBorder: nextDisabled ? '#dde2e3' : '#0db5cc',\n      nextLabel,\n      next: () => {\n        if (nextDisabled) return;\n        if (s.step === 5) return this.setState({ step: 0, phase: 'idle', key: '' });\n        if (s.step === 1) { this.setState({ step: 2 }); this.startSave(); return; }\n        this.setState({ step: s.step + 1 });\n      }\n    };\n  }\n}\n<\u002Fscript>\n\n<\u002Fbody><\u002Fhtml>"
  </script>
