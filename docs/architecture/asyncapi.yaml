          - $ref: "#/components/schemas/EventEnvelope"
          - type: object
            properties:
              type:
                const: org.created
              data:
                $ref: "#/components/schemas/orgCreatedData"
      x-stream-subject: org-<silo>
      examples:
        - name: default
          payload:
            id: evt_1
            source: opencrane-server
            time: "2026-10-01T09:00:00.000Z"
            silo: acme
            type: org.created
            subject: org-acme
            data:
              orgName: Acme Ltd
