# Generated by `npm run gen:asyncapi` from libs/events/src/registry.ts.
# Do not edit by hand: `npm run check:asyncapi` (in CI) fails if this file
# doesn't match what the registry would generate. See
# docs/architecture/events.md for the prose version of this catalogue.
asyncapi: 3.0.0
info:
  title: OpenCrane 2 event catalogue
  version: 1.0.0
  description: Every event type in libs/events/src/registry.ts, generated from its zod schema. See docs/architecture/events.md for which projection or reaction reads each one.
channels:
  approval:
    address: ev.approval.>
    messages:
      toolApprovalRequested:
        $ref: "#/components/messages/toolApprovalRequested"
      approvalDecided:
        $ref: "#/components/messages/approvalDecided"
      approvalExpired:
        $ref: "#/components/messages/approvalExpired"
      approvalUsed:
        $ref: "#/components/messages/approvalUsed"
  assistant:
    address: ev.assistant.>
    messages:
      assistantCreated:
        $ref: "#/components/messages/assistantCreated"
      assistantSettingsChanged:
        $ref: "#/components/messages/assistantSettingsChanged"
  budget:
    address: ev.budget.>
    messages:
      budgetCeilingSet:
        $ref: "#/components/messages/budgetCeilingSet"
      budgetReserved:
        $ref: "#/components/messages/budgetReserved"
      budgetSettled:
        $ref: "#/components/messages/budgetSettled"
      budgetPeriodStarted:
        $ref: "#/components/messages/budgetPeriodStarted"
      budgetExhausted:
        $ref: "#/components/messages/budgetExhausted"
  computer:
    address: ev.computer.>
    messages:
      computerClaimed:
        $ref: "#/components/messages/computerClaimed"
      computerReady:
        $ref: "#/components/messages/computerReady"
      computerSuspended:
        $ref: "#/components/messages/computerSuspended"
      computerResumed:
        $ref: "#/components/messages/computerResumed"
      computerLost:
        $ref: "#/components/messages/computerLost"
      computerRetired:
        $ref: "#/components/messages/computerRetired"
      takeoverStarted:
        $ref: "#/components/messages/takeoverStarted"
      takeoverEnded:
        $ref: "#/components/messages/takeoverEnded"
  connection:
    address: ev.connection.>
    messages:
      connectionCreated:
        $ref: "#/components/messages/connectionCreated"
      connectionRefreshed:
        $ref: "#/components/messages/connectionRefreshed"
      connectionRevoked:
        $ref: "#/components/messages/connectionRevoked"
  conversation:
    address: ev.conversation.>
    messages:
      conversationCreated:
        $ref: "#/components/messages/conversationCreated"
      participantAdded:
        $ref: "#/components/messages/participantAdded"
      participantRemoved:
        $ref: "#/components/messages/participantRemoved"
      messagePosted:
        $ref: "#/components/messages/messagePosted"
      agentTurnStarted:
        $ref: "#/components/messages/agentTurnStarted"
      agentTurnCompleted:
        $ref: "#/components/messages/agentTurnCompleted"
      agentTurnFailed:
        $ref: "#/components/messages/agentTurnFailed"
      agentMessageCompleted:
        $ref: "#/components/messages/agentMessageCompleted"
      agentReasoningSummarised:
        $ref: "#/components/messages/agentReasoningSummarised"
      agentCommandRan:
        $ref: "#/components/messages/agentCommandRan"
      agentFileChanged:
        $ref: "#/components/messages/agentFileChanged"
      conversationClosed:
        $ref: "#/components/messages/conversationClosed"
  delegation:
    address: ev.delegation.>
    messages:
      delegationStarted:
        $ref: "#/components/messages/delegationStarted"
      delegationCompleted:
        $ref: "#/components/messages/delegationCompleted"
  effect:
    address: ev.effect.>
    messages:
      effectObserved:
        $ref: "#/components/messages/effectObserved"
      effectUncertain:
        $ref: "#/components/messages/effectUncertain"
      effectResolved:
        $ref: "#/components/messages/effectResolved"
  grant:
    address: ev.grant.>
    messages:
      grantGiven:
        $ref: "#/components/messages/grantGiven"
      grantRevoked:
        $ref: "#/components/messages/grantRevoked"
  mcp:
    address: ev.mcp.>
    messages:
      mcpServerRegistered:
        $ref: "#/components/messages/mcpServerRegistered"
      mcpServerDiscovered:
        $ref: "#/components/messages/mcpServerDiscovered"
      mcpServerRejected:
        $ref: "#/components/messages/mcpServerRejected"
      mcpToolModeSet:
        $ref: "#/components/messages/mcpToolModeSet"
      mcpServerPublished:
        $ref: "#/components/messages/mcpServerPublished"
      mcpServerUnpublished:
        $ref: "#/components/messages/mcpServerUnpublished"
      mcpToolListChanged:
        $ref: "#/components/messages/mcpToolListChanged"
  member:
    address: ev.member.>
    messages:
      memberInvited:
        $ref: "#/components/messages/memberInvited"
      memberJoined:
        $ref: "#/components/messages/memberJoined"
      memberRoleChanged:
        $ref: "#/components/messages/memberRoleChanged"
      memberRemoved:
        $ref: "#/components/messages/memberRemoved"
  org:
    address: ev.org.>
    messages:
      orgCreated:
        $ref: "#/components/messages/orgCreated"
  routine:
    address: ev.routine.>
    messages:
      routineCreated:
        $ref: "#/components/messages/routineCreated"
      routineUpdated:
        $ref: "#/components/messages/routineUpdated"
      routinePaused:
        $ref: "#/components/messages/routinePaused"
      routineResumed:
        $ref: "#/components/messages/routineResumed"
      routineRetired:
        $ref: "#/components/messages/routineRetired"
      routineDue:
        $ref: "#/components/messages/routineDue"
  scope:
    address: ev.scope.>
    messages:
      memoryWritten:
        $ref: "#/components/messages/memoryWritten"
      memoryCorrected:
        $ref: "#/components/messages/memoryCorrected"
      memoryForgotten:
        $ref: "#/components/messages/memoryForgotten"
      memoryConsolidated:
        $ref: "#/components/messages/memoryConsolidated"
      scopePromotionRequested:
        $ref: "#/components/messages/scopePromotionRequested"
      scopePromoted:
        $ref: "#/components/messages/scopePromoted"
  security:
    address: ev.security.>
    messages:
      securityAlertRaised:
        $ref: "#/components/messages/securityAlertRaised"
  team:
    address: ev.team.>
    messages:
      teamCreated:
        $ref: "#/components/messages/teamCreated"
      teamMemberAdded:
        $ref: "#/components/messages/teamMemberAdded"
      teamMemberRemoved:
        $ref: "#/components/messages/teamMemberRemoved"
components:
  messages:
    orgCreated:
      name: org.created
      title: org.created
      summary: A new silo (customer organisation) was installed.
      payload:
        $ref: "#/components/schemas/orgCreatedData"
      x-stream-subject: org-<silo>
      examples:
        - name: default
          payload:
            orgName: Acme Ltd
    memberInvited:
      name: member.invited
      title: member.invited
      summary: An admin invited someone to join.
      payload:
        $ref: "#/components/schemas/memberInvitedData"
      x-stream-subject: member-<memberId>
      examples:
        - name: default
          payload:
            memberId: mem_2
            email: bob@example.com
            role: member
            invitedBy: mem_1
            invitationId: inv_1
    memberJoined:
      name: member.joined
      title: member.joined
      summary: An invitation was accepted and the person became a member.
      payload:
        $ref: "#/components/schemas/memberJoinedData"
      x-stream-subject: member-<memberId>
      examples:
        - name: default
          payload:
            memberId: mem_1
            email: alice@example.com
            displayName: Alice
            role: member
    memberRoleChanged:
      name: member.role_changed
      title: member.role_changed
      summary: An admin changed a member's role.
      payload:
        $ref: "#/components/schemas/memberRoleChangedData"
      x-stream-subject: member-<memberId>
      examples:
        - name: default
          payload:
            memberId: mem_1
            previousRole: member
            newRole: admin
            changedBy: mem_2
    memberRemoved:
      name: member.removed
      title: member.removed
      summary: An admin removed a member from the silo.
      payload:
        $ref: "#/components/schemas/memberRemovedData"
      x-stream-subject: member-<memberId>
      examples:
        - name: default
          payload:
            memberId: mem_1
            removedBy: mem_2
    teamCreated:
      name: team.created
      title: team.created
      summary: An admin created a team.
      payload:
        $ref: "#/components/schemas/teamCreatedData"
      x-stream-subject: team-<teamId>
      examples:
        - name: default
          payload:
            teamId: team_1
            name: Sales
            createdBy: mem_1
    teamMemberAdded:
      name: team.member_added
      title: team.member_added
      summary: An admin added a member to a team.
      payload:
        $ref: "#/components/schemas/teamMemberAddedData"
      x-stream-subject: team-<teamId>
      examples:
        - name: default
          payload:
            teamId: team_1
            memberId: mem_1
            addedBy: mem_2
    teamMemberRemoved:
      name: team.member_removed
      title: team.member_removed
      summary: An admin removed a member from a team.
      payload:
        $ref: "#/components/schemas/teamMemberRemovedData"
      x-stream-subject: team-<teamId>
      examples:
        - name: default
          payload:
            teamId: team_1
            memberId: mem_1
            removedBy: mem_2
    assistantCreated:
      name: assistant.created
      title: assistant.created
      summary: A personal or team assistant was created (usually reacting to member.joined).
      payload:
        $ref: "#/components/schemas/assistantCreatedData"
      x-stream-subject: assistant-<assistantId>
      examples:
        - name: default
          payload:
            assistantId: asst_1
            ownerId: mem_1
            kind: personal
    assistantSettingsChanged:
      name: assistant.settings_changed
      title: assistant.settings_changed
      summary: An owner or admin changed an assistant's model, persona or tools.
      payload:
        $ref: "#/components/schemas/assistantSettingsChangedData"
      x-stream-subject: assistant-<assistantId>
      examples:
        - name: default
          payload:
            assistantId: asst_1
            changedBy: mem_1
            changedFields:
              - model
    computerClaimed:
      name: computer.claimed
      title: computer.claimed
      summary: The server bound a warm Pod to an assistant and issued its token.
      payload:
        $ref: "#/components/schemas/computerClaimedData"
      x-stream-subject: computer-<assistantId>
      examples:
        - name: default
          payload:
            assistantId: asst_1
            computerId: computer_1
            podUid: pod-uid-1
            generation: 1
    computerReady:
      name: computer.ready
      title: computer.ready
      summary: The bridge reported the computer is ready to receive work.
      payload:
        $ref: "#/components/schemas/computerReadyData"
      x-stream-subject: computer-<assistantId>
      examples:
        - name: default
          payload:
            assistantId: asst_1
            computerId: computer_1
    computerSuspended:
      name: computer.suspended
      title: computer.suspended
      summary: The server suspended an idle computer to a snapshot.
      payload:
        $ref: "#/components/schemas/computerSuspendedData"
      x-stream-subject: computer-<assistantId>
      examples:
        - name: default
          payload:
            assistantId: asst_1
            computerId: computer_1
            snapshotId: snap_1
    computerResumed:
      name: computer.resumed
      title: computer.resumed
      summary: The server resumed a computer from its snapshot.
      payload:
        $ref: "#/components/schemas/computerResumedData"
      x-stream-subject: computer-<assistantId>
      examples:
        - name: default
          payload:
            assistantId: asst_1
            computerId: computer_1
            snapshotId: snap_1
    computerLost:
      name: computer.lost
      title: computer.lost
      summary: The computer's Pod disappeared unexpectedly.
      payload:
        $ref: "#/components/schemas/computerLostData"
      x-stream-subject: computer-<assistantId>
      examples:
        - name: default
          payload:
            assistantId: asst_1
            computerId: computer_1
    computerRetired:
      name: computer.retired
      title: computer.retired
      summary: The computer was retired and its snapshots are due for deletion.
      payload:
        $ref: "#/components/schemas/computerRetiredData"
      x-stream-subject: computer-<assistantId>
      examples:
        - name: default
          payload:
            assistantId: asst_1
            computerId: computer_1
    takeoverStarted:
      name: takeover.started
      title: takeover.started
      summary: A person started a live-view takeover of a computer.
      payload:
        $ref: "#/components/schemas/takeoverStartedData"
      x-stream-subject: computer-<assistantId>
      examples:
        - name: default
          payload:
            assistantId: asst_1
            computerId: computer_1
            requestedBy: mem_1
    takeoverEnded:
      name: takeover.ended
      title: takeover.ended
      summary: A live-view takeover ended and control returned to the agent.
      payload:
        $ref: "#/components/schemas/takeoverEndedData"
      x-stream-subject: computer-<assistantId>
      examples:
        - name: default
          payload:
            assistantId: asst_1
            computerId: computer_1
            endedBy: mem_1
    conversationCreated:
      name: conversation.created
      title: conversation.created
      summary: A new conversation was started.
      payload:
        $ref: "#/components/schemas/conversationCreatedData"
      x-stream-subject: conversation-<conversationId>
      examples:
        - name: default
          payload:
            conversationId: conv_1
            assistantId: asst_1
            createdBy: mem_1
    participantAdded:
      name: participant.added
      title: participant.added
      summary: Someone was added to a conversation.
      payload:
        $ref: "#/components/schemas/participantAddedData"
      x-stream-subject: conversation-<conversationId>
      examples:
        - name: default
          payload:
            conversationId: conv_1
            participantId: mem_2
            addedBy: mem_1
    participantRemoved:
      name: participant.removed
      title: participant.removed
      summary: Someone was removed from a conversation.
      payload:
        $ref: "#/components/schemas/participantRemovedData"
      x-stream-subject: conversation-<conversationId>
      examples:
        - name: default
          payload:
            conversationId: conv_1
            participantId: mem_2
            removedBy: mem_1
    messagePosted:
      name: message.posted
      title: message.posted
      summary: A person, or the system for a routine, posted a message into a conversation.
      payload:
        $ref: "#/components/schemas/messagePostedData"
      x-stream-subject: conversation-<conversationId>
      examples:
        - name: default
          payload:
            conversationId: conv_1
            authorId: alice
            authorKind: human
            ciphertext: ZmFrZS1jaXBoZXJ0ZXh0
            contentType: text
    agentTurnStarted:
      name: agent.turn_started
      title: agent.turn_started
      summary: The bridge reported that the assistant started a turn.
      payload:
        $ref: "#/components/schemas/agentTurnStartedData"
      x-stream-subject: conversation-<conversationId>
      examples:
        - name: default
          payload:
            conversationId: conv_1
            turnId: turn_1
            assistantId: asst_1
    agentTurnCompleted:
      name: agent.turn_completed
      title: agent.turn_completed
      summary: The bridge reported that a turn finished.
      payload:
        $ref: "#/components/schemas/agentTurnCompletedData"
      x-stream-subject: conversation-<conversationId>
      examples:
        - name: default
          payload:
            conversationId: conv_1
            turnId: turn_1
    agentTurnFailed:
      name: agent.turn_failed
      title: agent.turn_failed
      summary: The bridge reported that a turn failed.
      payload:
        $ref: "#/components/schemas/agentTurnFailedData"
      x-stream-subject: conversation-<conversationId>
      examples:
        - name: default
          payload:
            conversationId: conv_1
            turnId: turn_1
            reason: model_error
    agentMessageCompleted:
      name: agent.message_completed
      title: agent.message_completed
      summary: The bridge reported a completed assistant message.
      payload:
        $ref: "#/components/schemas/agentMessageCompletedData"
      x-stream-subject: conversation-<conversationId>
      examples:
        - name: default
          payload:
            conversationId: conv_1
            turnId: turn_1
            messageId: msg_1
            ciphertext: ZmFrZS1jaXBoZXJ0ZXh0
            keyId: key_1
            contentType: text
    agentReasoningSummarised:
      name: agent.reasoning_summarised
      title: agent.reasoning_summarised
      summary: The bridge reported a reasoning summary for a turn.
      payload:
        $ref: "#/components/schemas/agentReasoningSummarisedData"
      x-stream-subject: conversation-<conversationId>
      examples:
        - name: default
          payload:
            conversationId: conv_1
            turnId: turn_1
            ciphertext: ZmFrZS1jaXBoZXJ0ZXh0
            keyId: key_1
    agentCommandRan:
      name: agent.command_ran
      title: agent.command_ran
      summary: The bridge reported a command the agent ran, with its exit status.
      payload:
        $ref: "#/components/schemas/agentCommandRanData"
      x-stream-subject: conversation-<conversationId>
      examples:
        - name: default
          payload:
            conversationId: conv_1
            turnId: turn_1
            commandDigest: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
            exitCode: 0
    agentFileChanged:
      name: agent.file_changed
      title: agent.file_changed
      summary: The bridge reported a file the agent changed in its workspace.
      payload:
        $ref: "#/components/schemas/agentFileChangedData"
      x-stream-subject: conversation-<conversationId>
      examples:
        - name: default
          payload:
            conversationId: conv_1
            turnId: turn_1
            path: notes/summary.md
            changeType: created
    conversationClosed:
      name: conversation.closed
      title: conversation.closed
      summary: A conversation was closed; the computer should stop work on it.
      payload:
        $ref: "#/components/schemas/conversationClosedData"
      x-stream-subject: conversation-<conversationId>
      examples:
        - name: default
          payload:
            conversationId: conv_1
            closedBy: mem_1
    toolApprovalRequested:
      name: tool.approval_requested
      title: tool.approval_requested
      summary: The decision service refused a call in "Ask" mode and opened an approval.
      payload:
        $ref: "#/components/schemas/toolApprovalRequestedData"
      x-stream-subject: approval-<approvalId>
      examples:
        - name: default
          payload:
            approvalId: appr_1
            conversationId: conv_1
            turnId: turn_1
            tool: odoo.write
            argumentsDigest: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
            requesterId: mem_1
    approvalDecided:
      name: approval.decided
      title: approval.decided
      summary: A person approved or rejected a pending tool call.
      payload:
        $ref: "#/components/schemas/approvalDecidedData"
      x-stream-subject: approval-<approvalId>
      examples:
        - name: default
          payload:
            approvalId: appr_1
            decision: approved
            decidedBy: mem_1
    approvalExpired:
      name: approval.expired
      title: approval.expired
      summary: An approval timed out before anyone decided it.
      payload:
        $ref: "#/components/schemas/approvalExpiredData"
      x-stream-subject: approval-<approvalId>
      examples:
        - name: default
          payload:
            approvalId: appr_1
    approvalUsed:
      name: approval.used
      title: approval.used
      summary: A single-use approval was consumed by its matching retry.
      payload:
        $ref: "#/components/schemas/approvalUsedData"
      x-stream-subject: approval-<approvalId>
      examples:
        - name: default
          payload:
            approvalId: appr_1
            permitId: permit_1
    effectObserved:
      name: effect.observed
      title: effect.observed
      summary: The gateway observed an external call (model, tool or web) complete.
      payload:
        $ref: "#/components/schemas/effectObservedData"
      x-stream-subject: effect-<permitId>
      examples:
        - name: default
          payload:
            permitId: permit_1
            computerId: computer_1
            tool: odoo.read
            destination: odoo-mcp
            costEur: 0.02
            outcome: success
    effectUncertain:
      name: effect.uncertain
      title: effect.uncertain
      summary: An effect's outcome is unknown after a settle timeout or a lost computer.
      payload:
        $ref: "#/components/schemas/effectUncertainData"
      x-stream-subject: effect-<permitId>
      examples:
        - name: default
          payload:
            permitId: permit_1
            computerId: computer_1
            reason: settle_timeout
    effectResolved:
      name: effect.resolved
      title: effect.resolved
      summary: A person resolved an uncertain effect.
      payload:
        $ref: "#/components/schemas/effectResolvedData"
      x-stream-subject: effect-<permitId>
      examples:
        - name: default
          payload:
            permitId: permit_1
            resolvedBy: mem_1
            outcome: settled
    mcpServerRegistered:
      name: mcp.server_registered
      title: mcp.server_registered
      summary: An admin registered a new MCP server in the catalogue (draft).
      payload:
        $ref: "#/components/schemas/mcpServerRegisteredData"
      x-stream-subject: mcp-<serverId>
      examples:
        - name: default
          payload:
            serverId: mcp_1
            kind: remote
            locator: https://mcp.example.com
            registeredBy: mem_1
    mcpServerDiscovered:
      name: mcp.server_discovered
      title: mcp.server_discovered
      summary: Discovery read the server's tool list and schema digests.
      payload:
        $ref: "#/components/schemas/mcpServerDiscoveredData"
      x-stream-subject: mcp-<serverId>
      examples:
        - name: default
          payload:
            serverId: mcp_1
            toolCount: 3
            schemaDigest: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    mcpServerRejected:
      name: mcp.server_rejected
      title: mcp.server_rejected
      summary: Validation (SSRF guard or image scan) failed, so the server was rejected.
      payload:
        $ref: "#/components/schemas/mcpServerRejectedData"
      x-stream-subject: mcp-<serverId>
      examples:
        - name: default
          payload:
            serverId: mcp_1
            reason: ssrf_guard_failed
    mcpToolModeSet:
      name: mcp.tool_mode_set
      title: mcp.tool_mode_set
      summary: An admin set a tool to Allow automatically, Ask, or Block.
      payload:
        $ref: "#/components/schemas/mcpToolModeSetData"
      x-stream-subject: mcp-<serverId>
      examples:
        - name: default
          payload:
            serverId: mcp_1
            toolName: odoo.write
            mode: ask
            setBy: mem_1
    mcpServerPublished:
      name: mcp.server_published
      title: mcp.server_published
      summary: An admin published an MCP server, generating its gateway route.
      payload:
        $ref: "#/components/schemas/mcpServerPublishedData"
      x-stream-subject: mcp-<serverId>
      examples:
        - name: default
          payload:
            serverId: mcp_1
            publishedBy: mem_1
    mcpServerUnpublished:
      name: mcp.server_unpublished
      title: mcp.server_unpublished
      summary: An admin unpublished an MCP server, removing its gateway route.
      payload:
        $ref: "#/components/schemas/mcpServerUnpublishedData"
      x-stream-subject: mcp-<serverId>
      examples:
        - name: default
          payload:
            serverId: mcp_1
            unpublishedBy: mem_1
    mcpToolListChanged:
      name: mcp.tool_list_changed
      title: mcp.tool_list_changed
      summary: A drift check found the server's tool list or schema changed.
      payload:
        $ref: "#/components/schemas/mcpToolListChangedData"
      x-stream-subject: mcp-<serverId>
      examples:
        - name: default
          payload:
            serverId: mcp_1
            previousSchemaDigest: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
            newSchemaDigest: fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210
    grantGiven:
      name: grant.given
      title: grant.given
      summary: A shared resource was granted to a person, team or assistant.
      payload:
        $ref: "#/components/schemas/grantGivenData"
      x-stream-subject: grant-<resourceId>
      examples:
        - name: default
          payload:
            resourceId: mcp_1
            resourceType: mcp_server
            granteeId: team_1
            granteeKind: team
            grantedBy: mem_1
    grantRevoked:
      name: grant.revoked
      title: grant.revoked
      summary: A grant on a shared resource was revoked.
      payload:
        $ref: "#/components/schemas/grantRevokedData"
      x-stream-subject: grant-<resourceId>
      examples:
        - name: default
          payload:
            resourceId: mcp_1
            granteeId: team_1
            revokedBy: mem_1
    connectionCreated:
