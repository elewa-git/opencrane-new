name: Approved application package

on:
  workflow_dispatch:
  push:
    branches: [main, work/pilot-15-s2]

concurrency:
  group: application-package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    if: github.repository == 'elewa-git/opencrane-new'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install image-check tooling
        run: nice -n 10 npm ci --no-audit --no-fund
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Check approval refusals
        run: |
          nice -n 10 node --test infra/package/application-approval.test.mjs infra/package/runtime-context.test.mjs
          nice -n 10 python3 infra/package/check-application.test.py
          nice -n 10 npx vitest run scripts/scanner-approval.test.mjs scripts/scanner-approval-host.test.mjs --maxWorkers=2
      - name: Build, inspect, scan and authenticate the application
        run: nice -n 10 bash infra/package/approve-application.sh "$RUNNER_TEMP/application"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: application-approval
          path: ${{ runner.temp }}/application/output/
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: application-image
          path: ${{ runner.temp }}/application/application.tar
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
