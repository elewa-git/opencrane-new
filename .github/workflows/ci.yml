name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Check the event catalogue matches the registry
        run: npm run check:events

      # apps/web builds and tests through the Angular CLI, so it needs its own steps.
      - name: Build apps/web
        run: npm run build -w apps/web

      - name: Test apps/web
        run: npm run test -w apps/web
