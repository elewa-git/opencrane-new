name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PG_TEST_URL: postgres://postgres:test-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Lychee
        run: sh scripts/fetch-lychee.sh && .tools/lychee --version

      - name: Install pinned NATS server
        run: sh scripts/fetch-nats.sh

      # Browser tests use the Chromium build that matches the pinned playwright package.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Authz tests start/stop loopback-only OpenFGA containers and migrate a
      # disposable database on the PostgreSQL service above. Linux host networking
      # lets OpenFGA reach that service without exposing its API beyond localhost.
      - name: Verify Docker for real OpenFGA tests
        run: docker info

      - uses: docker/setup-buildx-action@v3

      - name: Build the upload test computer from public pins
        uses: docker/bake-action@v6
        with:
          source: .
          files: apps/computer/test/upload-bake.hcl
          load: true
          set: |
            computer.cache-from=type=gha,scope=upload-computer
            computer.cache-to=type=gha,scope=upload-computer,mode=max

      - name: Test
        run: npm test

      - name: Check the event catalogue matches the registry
        run: npm run check:events

      # apps/web builds and tests through the Angular CLI, so it needs its own steps.
      - name: Build apps/web
        run: npm run build -w apps/web

      - name: Test apps/web
        run: npm run test -w apps/web
