name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel older pull request runs when a new commit arrives.
# Give each main push and manual run its own group.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select.outcome == 'success' && steps.select.outputs.mode || 'full' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Decide using the base commit's rules
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo 'mode=full' >> "$GITHUB_OUTPUT"
          elif ! git cat-file -e "$BASE_SHA:scripts/ci/select.mjs" 2>/dev/null; then
            echo '::notice::The base commit has no decision script; running every check.'
            echo 'mode=full' >> "$GITHUB_OUTPUT"
          else
            git show "$BASE_SHA:scripts/ci/select.mjs" > "$RUNNER_TEMP/ci-select.mjs"
            node "$RUNNER_TEMP/ci-select.mjs" "$EVENT_NAME" "$BASE_SHA" "$HEAD_SHA"
          fi

  checks:
    needs: select
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: List every root test file
        if: needs.select.outputs.mode != 'docs'
        run: |
          mkdir -p .tools/ci
          nice -n 10 npx vitest list --filesOnly --json > .tools/ci/expected.json

      - uses: actions/upload-artifact@v4
        if: needs.select.outputs.mode != 'docs'
        with:
          name: expected-test-files
          path: .tools/ci/expected.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

      - name: Check shipped npm dependencies
        if: needs.select.outputs.mode != 'docs'
        timeout-minutes: 5
        run: |
          npm audit --omit=dev --audit-level=high
          audit_dir="$(mktemp -d)"
          trap 'rm -rf "$audit_dir"' EXIT
          cp apps/computer/runtime-package.json "$audit_dir/package.json"
          cp apps/computer/runtime-package-lock.json "$audit_dir/package-lock.json"
          npm audit --omit=dev --audit-level=high --prefix "$audit_dir"

      - name: Install pinned Lychee
        run: sh scripts/fetch-lychee.sh && .tools/lychee --version

      - name: Lint
        if: needs.select.outputs.mode != 'docs'
        # Public runners have 16 GB of memory.
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: /usr/bin/time -v nice -n 10 npm run lint

      - name: Typecheck
        if: needs.select.outputs.mode != 'docs'
        run: nice -n 10 npm run typecheck

      - name: Check the event catalogue matches the registry
        if: needs.select.outputs.mode != 'docs'
        run: npm run check:events

      - name: Read Chromium package cache versions
        if: needs.select.outputs.mode != 'docs'
        id: chromium-cache-key
        run: |
          playwright_version=$(node -p 'require("playwright/package.json").version')
          printf 'key=chromium-debs-v1-%s-%s-%s-%s\n' \
            "$RUNNER_OS" "$RUNNER_ARCH" "$ImageVersion" "$playwright_version" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium system packages
        if: needs.select.outputs.mode != 'docs'
        uses: actions/cache@v4
        with:
          path: .tools/ci/chromium-debs/*.deb
          key: ${{ steps.chromium-cache-key.outputs.key }}

      - name: Install Chromium for demo recording checks
        if: needs.select.outputs.mode != 'docs'
        run: bash scripts/ci/install-chromium.sh

      - name: Check CI test grouping
        if: needs.select.outputs.mode != 'docs'
        run: nice -n 10 node --test scripts/ci/*.test.mjs

      - name: Check local provider setup and model stub
        if: needs.select.outputs.mode != 'docs'
        run: >-
          nice -n 10 node --experimental-strip-types --test
          infra/dev-stack/model-stub.test.ts infra/dev-stack/models-environment.test.ts
          infra/dev-stack/mcp-resources.test.ts infra/dev-stack/mcp-hosted-fixture.test.ts
          infra/dev-stack/provider-setup.test.ts infra/dev-stack/daily-fresh.test.ts
          infra/dev-stack/daily-fresh-isolation.test.ts infra/dev-stack/secondary-models.test.ts
          infra/dev-stack/claim.test.ts
          infra/dev-stack/browser-group-chat.test.ts infra/dev-stack/group-removal-timing.test.ts
          infra/dev-stack/browser-group-removal.test.ts
          infra/dev-stack/journey-tool-policy.test.ts
          infra/dev-stack/browser-budgets.test.ts
          infra/dev-stack/browser-audit.test.ts
          infra/dev-stack/stage-b-capture.test.ts
          infra/dev-stack/stage-b-collector.test.ts
          infra/dev-stack/stage-b-launch.test.ts infra/dev-stack/stage-b-network.test.ts
          infra/dev-stack/demo-seed.test.ts infra/dev-stack/demo-up.test.ts
          infra/dev-stack/demo-seed-run.test.ts
          infra/dev-stack/stack-real-mode.test.ts infra/dev-stack/fleet-task.test.ts
          infra/dev-stack/stack-start.test.ts infra/dev-stack/journey-refusal.test.ts
          infra/dev-stack/private-settings.test.ts infra/dev-stack/compose.secondary.test.ts
          infra/dev-stack/demo-prepare.test.ts infra/dev-stack/demo-smoke.test.ts
          infra/dev-stack/demo-recovery.test.ts infra/dev-stack/demo-spending.test.ts
          infra/dev-stack/demo-rehearsal.test.ts infra/dev-stack/demo-rehearsal-repeat.test.ts
          infra/dev-stack/stage-b-local.test.ts infra/dev-stack/stage-b-model.test.ts
          infra/dev-stack/zitadel-setup.test.ts infra/package/fresh-twice.test.ts
          infra/package/browser-capture.test.ts infra/package/chart-render.test.mjs

      - name: Check the budget editor and ownership controls in Chromium
        if: needs.select.outputs.mode != 'docs'
        run: >-
          nice -n 10 node --experimental-strip-types --test --test-concurrency=1
          infra/dev-stack/browser-budget-editor.test.ts
          infra/dev-stack/browser-ownership.test.ts

      # apps/web builds and tests through the Angular CLI, so it needs its own steps.
      - name: Build apps/web
        if: needs.select.outputs.mode != 'docs'
        run: nice -n 10 npm run build -w apps/web

      - name: Test apps/web
        if: needs.select.outputs.mode != 'docs'
        run: nice -n 10 npm run test -w apps/web

      - name: Check documentation
        if: needs.select.outputs.mode == 'docs'
        run: |
          nice -n 10 npm run lint:docs
          nice -n 10 npm run lint:readmes
          nice -n 10 npm run lint:links
          nice -n 10 npm run lint:changelog

      - name: Keep event security rules checked on docs-only pull requests
        if: ${{ !cancelled() && needs.select.outputs.mode == 'docs' }}
        run: nice -n 10 npx vitest run libs/events/test/security-rules.test.ts --maxWorkers=2

  test:
    needs: select
    if: ${{ !cancelled() && needs.select.outputs.mode != 'docs' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:17.6-alpine
        env:
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PG_TEST_URL: postgres://postgres:test-only@127.0.0.1:5432/postgres
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install pinned NATS server
        run: sh scripts/fetch-nats.sh

      - name: Install socket tracing for offline signature tests
        run: command -v strace || (sudo apt-get update && sudo apt-get install -y strace)

      # Authz tests use disposable Docker containers and the PostgreSQL service above.
      - name: Verify Docker for real OpenFGA tests
        run: docker info

      - name: Test shard ${{ matrix.shard }} of 4
        run: nice -n 10 node scripts/ci/run-tests.mjs ${{ matrix.shard }}

      - name: Record test files
        if: always()
        run: node scripts/ci/test-files.mjs record ${{ matrix.shard }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-files-${{ matrix.shard }}
          path: .tools/ci/files-${{ matrix.shard }}.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: vitest-${{ matrix.shard }}
          path: .tools/ci/report.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  fixtures-image:
    needs: select
    if: ${{ !cancelled() && needs.select.outputs.mode != 'docs' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:17.6-alpine
        env:
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      NG_BUILD_MAX_WORKERS: '2'
      PG_TEST_URL: postgres://postgres:test-only@127.0.0.1:5432/postgres
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install pinned NATS server
        run: sh scripts/fetch-nats.sh

      # Authz tests use disposable Docker containers and the PostgreSQL service above.
      - name: Verify Docker for real OpenFGA tests
        run: docker info

      - uses: docker/setup-buildx-action@v3

      - name: Build the upload test computer from public pins
        uses: docker/bake-action@v6
        with:
          source: .
          files: apps/computer/test/upload-bake.hcl
          load: true
          set: |
            base.cache-from=type=gha,scope=upload-base
            base.cache-to=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'type=gha,scope=upload-base,mode=max' || '' }}
            computer.cache-from=type=gha,scope=upload-computer
            computer.cache-to=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'type=gha,scope=upload-computer,mode=max' || '' }}

      - name: Read Chromium package cache versions
        id: chromium-cache-key
        run: |
          playwright_version=$(node -p 'require("playwright/package.json").version')
          printf 'key=chromium-debs-v1-%s-%s-%s-%s\n' \
            "$RUNNER_OS" "$RUNNER_ARCH" "$ImageVersion" "$playwright_version" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium system packages
        uses: actions/cache@v4
        with:
          path: .tools/ci/chromium-debs/*.deb
          key: ${{ steps.chromium-cache-key.outputs.key }}

      # Browser tests use the Chromium build that matches the pinned playwright package.
      - name: Install Playwright Chromium
        run: bash scripts/ci/install-chromium.sh

      - name: Test files needing the computer image
        run: nice -n 10 node scripts/ci/run-tests.mjs fixtures-image

      - name: Record test files
        if: always()
        run: node scripts/ci/test-files.mjs record fixtures-image

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-files-fixtures-image
          path: .tools/ci/files-fixtures-image.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: vitest-fixtures-image
          path: .tools/ci/report.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  fixtures-browser:
    needs: select
    if: ${{ !cancelled() && needs.select.outputs.mode != 'docs' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:17.6-alpine
        env:
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      NG_BUILD_MAX_WORKERS: '2'
      PG_TEST_URL: postgres://postgres:test-only@127.0.0.1:5432/postgres
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install pinned NATS server
        run: sh scripts/fetch-nats.sh

      # Authz tests use disposable Docker containers and the PostgreSQL service above.
      - name: Verify Docker for real OpenFGA tests
        run: docker info

      - name: Read Chromium package cache versions
        id: chromium-cache-key
        run: |
          playwright_version=$(node -p 'require("playwright/package.json").version')
          printf 'key=chromium-debs-v1-%s-%s-%s-%s\n' \
            "$RUNNER_OS" "$RUNNER_ARCH" "$ImageVersion" "$playwright_version" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium system packages
        uses: actions/cache@v4
        with:
          path: .tools/ci/chromium-debs/*.deb
          key: ${{ steps.chromium-cache-key.outputs.key }}

      # Browser tests use the Chromium build that matches the pinned playwright package.
      - name: Install Playwright Chromium
        run: bash scripts/ci/install-chromium.sh

      - name: Test files needing Chromium
        run: nice -n 10 node scripts/ci/run-tests.mjs fixtures-browser

      - name: Record test files
        if: always()
        run: node scripts/ci/test-files.mjs record fixtures-browser

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-files-fixtures-browser
          path: .tools/ci/files-fixtures-browser.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: vitest-fixtures-browser
          path: .tools/ci/report.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  ci-ok:
    if: always()
    needs: [select, checks, test, fixtures-image, fixtures-browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        if: needs.select.outputs.mode != 'docs'
        with:
          name: expected-test-files
          path: .tools/ci

      - uses: actions/download-artifact@v4
        if: needs.select.outputs.mode != 'docs'
        with:
          pattern: test-files-*
          path: .tools/ci/groups
          merge-multiple: true

      - name: Require every root test file exactly once
        if: needs.select.outputs.mode != 'docs'
        run: node scripts/ci/test-files.mjs verify

      - name: Require checks, shards and fixture tests to pass
        if: always()
        env:
          CI_DECISION: ${{ needs.select.outputs.mode }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          TEST_RESULT: ${{ needs.test.result }}
          IMAGE_RESULT: ${{ needs.fixtures-image.result }}
          BROWSER_RESULT: ${{ needs.fixtures-browser.result }}
        run: node scripts/ci/select.mjs gate
