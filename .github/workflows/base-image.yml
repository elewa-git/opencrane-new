name: CI computer base image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .dockerignore
      - apps/computer/apt.lock
      - apps/computer/Dockerfile
      - apps/computer/tool-user.c
      - apps/computer/test/upload-base.Dockerfile
      - spikes/s0-1b-proxy-gvisor/package.json
      - spikes/s0-1b-proxy-gvisor/package-lock.json
      - .github/workflows/base-image.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Hash the base image build inputs
        id: inputs
        run: echo "hash=$(node scripts/ci/base-image.mjs hash)" >> "$GITHUB_OUTPUT"
      - name: Build and publish the saved package layers
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/computer/test/upload-base.Dockerfile
          push: true
          tags: ghcr.io/elewa-git/opencrane-ci-computer-base:main
          labels: io.opencrane.ci.base-inputs=${{ steps.inputs.outputs.hash }}
      - name: Show the digest for the follow-up change
        run: |
          echo 'ghcr.io/elewa-git/opencrane-ci-computer-base@${{ steps.build.outputs.digest }}'
          echo 'Build inputs: ${{ steps.inputs.outputs.hash }}'
