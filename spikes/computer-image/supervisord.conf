; Supervisor for the OpenCrane computer image. It runs as the normal "agent" user (never root) and is the
; container's main process. Every program logs to the container's standard output, so `kubectl logs` shows all.
;
; Not started here on purpose: the bridge and the local forwarding proxy (spike S0.1b starts them), and
; Playwright MCP (Codex starts it on demand, see /opt/computer/bin/playwright-mcp).

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
childlogdir=/tmp
loglevel=info

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; KasmVNC's X server: the desktop the person sees in the live view (web client on port 6901).
[program:xvnc]
command=/opt/computer/bin/run-xvnc
priority=10
autostart=true
autorestart=true
startsecs=3
startretries=20
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; A small window manager so windows can be maximised and focused.
[program:openbox]
command=/opt/computer/bin/run-openbox
priority=20
autostart=true
autorestart=true
startsecs=3
startretries=20
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Chromium on the KasmVNC display, with its debugging port on 127.0.0.1 only (Playwright MCP attaches to it).
[program:chromium]
command=/opt/computer/bin/run-chromium
priority=30
autostart=true
autorestart=true
startsecs=5
startretries=20
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Codex app-server, kept alive and idle on 127.0.0.1:4500 (WebSocket). No model provider and no key is configured.
[program:codex-app-server]
command=/opt/computer/bin/run-codex
priority=30
autostart=true
autorestart=true
startsecs=3
startretries=20
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Health endpoint on :8080: process list with PID and uptime from this supervisor, plus a live probe per process.
[program:health]
command=/usr/local/bin/node /opt/computer/health.mjs
priority=40
autostart=true
autorestart=true
startsecs=2
startretries=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
