<dialog [ocOverlay]="open()" #overlay="ocOverlay" ocPaperSurface="plain"
  [class.computer]="kind() === 'computer'"
  [returnFocusTo]="returnFocusTo()" (overlayClosed)="closed.emit()"
  [attr.aria-labelledby]="overlay.titleId"
  [attr.aria-describedby]="description() ? overlay.descriptionId : null">
  <header>
    @if (backLabel()) {
      <button type="button" class="back" (click)="overlay.dismiss()">
        <span aria-hidden="true">‹</span> {{ backLabel() }}
      </button>
    }
    <div class="heading">
      <h2 [id]="overlay.titleId" tabindex="-1">{{ title() }}</h2>
      @if (description()) { <p [id]="overlay.descriptionId">{{ description() }}</p> }
    </div>
    @if (!backLabel()) {
      <button type="button" class="close" (click)="overlay.dismiss()"
        [attr.aria-label]="'Close ' + title()">×</button>
    }
  </header>
  <section class="body" [ocDogEar]="foldedCorner && kind() !== 'computer'">
    <ng-content />
  </section>
  <footer><ng-content select="[overlayFooter]" /></footer>
</dialog>
