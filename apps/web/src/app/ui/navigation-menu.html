<dialog [ocOverlay]="open()" #overlay="ocOverlay" [returnFocusTo]="returnFocusTo()"
  [attr.aria-labelledby]="overlay.titleId" (overlayClosed)="closed.emit()">
  <header>
    <h2 class="heading" [id]="overlay.titleId" tabindex="-1">{{ label() }}</h2>
    <button type="button" class="close" aria-label="Close navigation"
      (click)="overlay.dismiss()">×</button>
  </header>
  <nav [attr.aria-label]="label()" (keydown)="move($event)">
    <ng-content />
  </nav>
</dialog>
