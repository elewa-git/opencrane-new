<div class="shell">
  <aside class="sidebar">
    <a class="brand" href="/workspace" aria-label="OpenCrane workspace">
      <oc-brand-mark /> Open<span class="brand-accent">Crane</span>
    </a>
    <div class="organisation">
      <strong>{{ organisationName() }}</strong><small>Organisation settings</small>
    </div>
    <nav aria-label="Organisation settings">
      @for (page of pages; track page.id) {
        <a [href]="page.href" [attr.aria-current]="activePage() === page.id ? 'page' : null">
          {{ page.label }}
        </a>
      }
    </nav>
    <div class="sidebar-footer">
      <a class="back" href="/workspace">‹ Back to workspace</a>
    </div>
  </aside>
  <header class="mobile-bar">
    <button #menuButton type="button" aria-label="Open organisation navigation"
      aria-controls="organisation-menu" [attr.aria-expanded]="menuOpen()"
      (click)="menuOpen.set(true)">☰</button>
    <span>{{ pageLabel() }}</span>
  </header>
  <main ocPaperSurface="main"><ng-content /></main>
</div>
<oc-navigation-menu id="organisation-menu" label="Organisation settings"
  [open]="menuOpen()" [returnFocusTo]="menuButton" (menuClosed)="menuOpen.set(false)">
  <div class="organisation">
    <strong>{{ organisationName() }}</strong>
  </div>
  @for (page of pages; track page.id) {
    <a [href]="page.href" [attr.aria-current]="activePage() === page.id ? 'page' : null">
      {{ page.label }}
    </a>
  }
  <a class="back" href="/workspace">‹ Back to workspace</a>
</oc-navigation-menu>
