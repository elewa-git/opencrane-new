<dl class="approval-ledger">
  <dt>Tool</dt><dd class="ledger-mono">{{ card().review.tool }}</dd>
  <dt>Target</dt><dd class="ledger-target">{{ card().review.target }}</dd>
  <dt>Data sent</dt><dd class="ledger-mono">{{ card().review.data }}</dd>
  <dt>Where</dt><dd>{{ card().review.destination }}</dd>
  <dt>Account</dt><dd>{{ card().review.account }}</dd>
  <dt>Requested by</dt><dd>{{ requester() }}</dd>
  <dt>Expires</dt><dd>{{ utcDateTime(card().expiresAt) }}</dd>
</dl>
