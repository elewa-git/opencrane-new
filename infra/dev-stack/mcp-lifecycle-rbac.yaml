apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-lifecycle
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mcp-lifecycle
rules:
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: [get, list, watch, create, patch, update, delete]
  - apiGroups: [apps]
    resources: [statefulsets/scale]
    verbs: [get, patch, update]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mcp-lifecycle
subjects:
  - kind: ServiceAccount
    name: mcp-lifecycle
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mcp-lifecycle
