apiVersion: v1
kind: ServiceAccount
metadata:
  name: computer-lifecycle
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: computer-lifecycle
rules:
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxclaims"]
    verbs: ["create", "get"]
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get", "patch", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/proxy"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: computer-lifecycle
subjects:
  - kind: ServiceAccount
    name: computer-lifecycle
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: computer-lifecycle
