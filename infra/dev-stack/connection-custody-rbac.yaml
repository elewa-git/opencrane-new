apiVersion: v1
kind: ServiceAccount
metadata:
  name: connection-custody
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: connection-custody
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: connection-custody
subjects:
  - kind: ServiceAccount
    name: connection-custody
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: connection-custody
