apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  type: ClusterIP
{{- if eq .Values.postgres.mode "cnpg" }}
  selector:
    cnpg.io/cluster: postgres
    cnpg.io/instanceRole: primary
{{- else }}
  selector: { app: postgres }
{{- end }}
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: v1
kind: Service
metadata:
  name: nats
spec:
  type: ClusterIP
  selector: { app: nats }
  ports: [{ port: 4222, targetPort: 4222 }]
---
apiVersion: v1
kind: Service
metadata:
  name: openfga
spec:
  type: ClusterIP
  selector: { app: openfga }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata:
  name: server
spec:
  type: ClusterIP
  selector: { app: server }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
    - { name: model, port: 43000, targetPort: 43000 }
    - { name: decision, port: 43001, targetPort: 43001 }
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  type: ClusterIP
  selector: { app: web }
  ports: [{ port: 80, targetPort: 8080 }]
