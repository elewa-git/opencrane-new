apiVersion: apps/v1
kind: Deployment
metadata:
  name: openfga
spec:
  replicas: 1
  selector:
    matchLabels: { app: openfga }
  template:
    metadata:
      labels: { app: openfga }
    spec:
      initContainers:
        - name: wait-for-postgres
          image: {{ required "postgres pin" .Values.images.postgres | quote }}
          command: [sh, -c, "until pg_isready -h postgres -U postgres; do sleep 2; done"]
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
        - name: migrate
          image: {{ required "OpenFGA pin" .Values.images.openfga | quote }}
          args: [migrate]
          envFrom:
            - secretRef: { name: {{ .Values.secrets.openfga | quote }} }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
      containers:
        - name: openfga
          image: {{ required "OpenFGA pin" .Values.images.openfga | quote }}
          args:
            - run
            - --http-addr
            - "0.0.0.0:8080"
            - --grpc-addr
            - "127.0.0.1:8081"
            - --playground-enabled=false
            - --metrics-enabled=false
          envFrom:
            - secretRef: { name: {{ .Values.secrets.openfga | quote }} }
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
spec:
  replicas: 1
  selector:
    matchLabels: { app: server }
  template:
    metadata:
      labels: { app: server }
    spec:
      serviceAccountName: package-worker
      securityContext: { fsGroup: 1000 }
      initContainers:
        - name: kubeconfig
          image: {{ .Values.images.server | quote }}
          command: [node, infra/package/kubeconfig.mjs]
          volumeMounts:
            - { name: kubeconfig, mountPath: /run/kubeconfig }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 50m, memory: 64Mi }
        - name: wait-for-binding
          image: {{ .Values.images.server | quote }}
          command: [sh, -c, 'until [ "$(cat /run/opencrane/OWNER_BOOTSTRAP_READY)" = ready ]; do sleep 2; done']
          volumeMounts:
            - { name: runtime, mountPath: /run/opencrane, readOnly: true }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 50m, memory: 64Mi }
        - name: copy-private-files
          image: {{ .Values.images.server | quote }}
          command: [sh, -ec]
          args:
            - >-
              cp /run/opencrane-source/* /run/opencrane/files/ &&
              chown 1000:1000 /run/opencrane/files/* &&
              chmod 0400 /run/opencrane/files/*
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: runtime-file-source, mountPath: /run/opencrane-source, readOnly: true }
            - { name: runtime-files, mountPath: /run/opencrane/files }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 50m, memory: 64Mi }
      containers:
        - name: server
          image: {{ required "server pin" .Values.images.server | quote }}
          command: [node, --experimental-strip-types, apps/server/src/main.ts]
          env:
            - { name: HOST, value: "0.0.0.0" }
            - { name: PORT, value: "8080" }
            - { name: KUBECONFIG, value: "/run/kubeconfig/config.json" }
            - name: KUBE_NAMESPACE
              valueFrom:
                fieldRef: { fieldPath: metadata.namespace }
          envFrom:
            - secretRef: { name: {{ .Values.secrets.runtime | quote }} }
          volumeMounts:
            - { name: runtime, mountPath: /run/opencrane, readOnly: true }
            - { name: runtime-files, mountPath: /run/opencrane/files, readOnly: true }
            - { name: keys, mountPath: /var/lib/opencrane/conversation-keys }
            - { name: kubeconfig, mountPath: /run/kubeconfig, readOnly: true }
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
        - name: models
          image: {{ .Values.images.server | quote }}
          command: [node, --experimental-strip-types, infra/dev-stack/secondary-models.ts]
          envFrom:
            - secretRef: { name: {{ .Values.secrets.runtime | quote }} }
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.runtime | quote }}
                  key: PROJECTION_DATABASE_URL
            - { name: NODE_OPTIONS, value: "--max-old-space-size=256" }
          volumeMounts:
            - { name: runtime, mountPath: /run/opencrane, readOnly: true }
            - { name: runtime-files, mountPath: /run/opencrane/files, readOnly: true }
            - { name: keys, mountPath: /var/lib/opencrane/conversation-keys }
            - { name: model-state, mountPath: /var/lib/opencrane/models }
          ports:
            - { containerPort: 43000, name: model-gateway }
            - { containerPort: 43001, name: model-decision }
          readinessProbe:
            httpGet: { path: /healthz/ready, port: 43002 }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: runtime
          secret: { secretName: {{ .Values.secrets.runtime | quote }} }
        - name: runtime-files
          emptyDir: { medium: Memory }
        - name: runtime-file-source
          secret:
            secretName: {{ .Values.secrets.runtimeFiles | quote }}
            defaultMode: 256
        - name: keys
          persistentVolumeClaim: { claimName: conversation-keys }
        - name: model-state
          emptyDir: {}
        - name: kubeconfig
          emptyDir: { medium: Memory }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: web
          image: {{ required "web pin" .Values.images.web | quote }}
          command: [node, infra/package/web.mjs]
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
