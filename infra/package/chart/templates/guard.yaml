{{- if or .Values.exposure.ingress .Values.exposure.loadBalancer .Values.exposure.funnel -}}
{{- fail "Public ingress, LoadBalancer and Funnel are refused" -}}
{{- end -}}
{{- range $name, $image := .Values.images -}}
{{- if not (regexMatch "@sha256:[a-f0-9]{64}$" $image) -}}
{{- fail (printf "Missing immutable image pin: %s" $name) -}}
{{- end -}}
{{- end -}}
{{- range $name, $secret := .Values.secrets -}}
{{- if empty $secret -}}
{{- fail (printf "Missing secret reference: %s" $name) -}}
{{- end -}}
{{- end -}}
{{- range $name, $value := .Values.postgres -}}
{{- if not (has $name (list "mode" "operatorContract" "superuserSecret" "applicationSecret" "backup")) -}}
{{- fail "Unsupported PostgreSQL setting" -}}
{{- end -}}
{{- end -}}
{{- if not (has .Values.postgres.mode (list "standalone" "cnpg")) -}}
{{- fail "Unsupported PostgreSQL mode" -}}
{{- end -}}
{{- if eq .Values.postgres.mode "cnpg" -}}
{{- if ne .Values.postgres.operatorContract "1.30" -}}
{{- fail "Unsupported CNPG operator contract" -}}
{{- end -}}
{{- range $name := list "superuserSecret" "applicationSecret" -}}
{{- $secret := index $.Values.postgres $name -}}
{{- if not (and (kindIs "string" $secret) (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" $secret)) -}}
{{- fail "Missing CNPG credential reference" -}}
{{- end -}}
{{- if eq $secret $.Values.secrets.postgres -}}
{{- fail "Separate CNPG credential references are required" -}}
{{- end -}}
{{- end -}}
{{- if eq .Values.postgres.superuserSecret .Values.postgres.applicationSecret -}}
{{- fail "Separate CNPG credential references are required" -}}
{{- end -}}
{{- end -}}
{{- include "opencrane.backupGuard" . -}}
{{- if .Values.natsCluster.enabled -}}
{{- if not (kindIs "bool" .Values.natsCluster.renderOnly) -}}
{{- fail "NATS cluster requires an explicit preview choice" -}}
{{- end -}}
{{- $cluster := .Values.natsCluster -}}
{{- $references := prepend $cluster.peerCertificateSecrets $cluster.routeCASecret -}}
{{- if ne (len $cluster.peerCertificateSecrets) 3 -}}
{{- fail "NATS cluster requires three separate peer certificate references" -}}
{{- end -}}
{{- if ne (len (uniq $references)) 4 -}}
{{- fail "NATS cluster requires separate route trust and peer identities" -}}
{{- end -}}
{{- range $reference := $references -}}
{{- if or (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" $reference))
          (has $reference (values $.Values.secrets)) -}}
{{- fail "NATS cluster requires private route references separate from client settings" -}}
{{- end -}}
{{- end -}}
{{- end -}}
