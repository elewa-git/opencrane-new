{{- $root := . -}}
{{- $modes := list "members" "mcp-catalogue" "computers" "conversations" "files" "budgets" "audit" "dispatcher" -}}
{{- if eq (toString .Values.models.mode) "provider" -}}
{{- $modes = append $modes "routines" -}}
{{- end -}}
{{- range $mode := $modes }}
{{- $dispatcher := eq $mode "dispatcher" }}
{{- $memoryReader := and (eq $mode "members") (not $root.Values.pilotRestore.enabled) }}
{{- $memoryWriter := and $dispatcher (not $root.Values.pilotRestore.enabled) }}
{{- $memory := or $memoryReader $memoryWriter }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-{{ $mode }}
spec:
  replicas: {{ ternary 0 1 $root.Values.pilotRestore.enabled }}
  selector:
    matchLabels: { app: worker-{{ $mode }} }
  template:
    metadata:
      labels: { app: worker-{{ $mode }} }
    spec:
      {{- if $dispatcher }}
      serviceAccountName: package-dispatcher
      {{- else }}
      serviceAccountName: package-projection
      automountServiceAccountToken: false
      {{- end }}
      {{- if $memory }}
      securityContext: { fsGroup: 1000, fsGroupChangePolicy: OnRootMismatch }
      {{- else }}
      securityContext: { fsGroup: 1000 }
      {{- end }}
      initContainers:
        {{- if $dispatcher }}
        - name: kubeconfig
          image: {{ $root.Values.images.server | quote }}
          command: [node, infra/package/kubeconfig.mjs]
          volumeMounts:
            - { name: kubeconfig, mountPath: /run/kubeconfig }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 50m, memory: 64Mi }
        {{- end }}
        - name: wait-for-binding
          image: {{ $root.Values.images.server | quote }}
          command: [sh, -c, 'until [ "$(cat /run/opencrane/OPENFGA_STORE_ID)" != pending ]; do sleep 2; done']
          volumeMounts:
            - { name: runtime, mountPath: /run/opencrane, readOnly: true }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 50m, memory: 64Mi }
        - name: copy-private-files
          image: {{ $root.Values.images.server | quote }}
          command: [sh, -ec]
          args:
            - >-
              cp /run/opencrane-source/* /run/opencrane/files/ &&
              chown 1000:1000 /run/opencrane/files/* &&
              chmod 0400 /run/opencrane/files/*
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: runtime-file-source, mountPath: /run/opencrane-source, readOnly: true }
            - { name: runtime-files, mountPath: /run/opencrane/files }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 50m, memory: 64Mi }
        {{- if $memory }}
        {{- $init := dict "name" "private-memory-keys" "image" $root.Values.images.server "volumes" (list "memory-secrets") }}
        {{- include "opencrane.memberKeyInit" $init | nindent 8 }}
        {{- end }}
      containers:
        - name: worker
          image: {{ $root.Values.images.server | quote }}
          command: [node, infra/package/worker.mjs, {{ $mode | quote }}]
          envFrom:
            - secretRef: { name: {{ $root.Values.secrets.runtime | quote }} }
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.secrets.runtime | quote }}
                  key: {{ if $dispatcher }}HANDLER_DATABASE_URL{{ else }}PROJECTION_DATABASE_URL{{ end }}
            {{- if $dispatcher }}
            - name: CONTENT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.secrets.runtime | quote }}
                  key: DATABASE_URL
            {{- end }}
            - { name: NATS_CERT_FILE, value: "/run/opencrane/files/{{ if $dispatcher }}dispatcher{{ else }}projection{{ end }}.crt" }
            - { name: NATS_KEY_FILE, value: "/run/opencrane/files/{{ if $dispatcher }}dispatcher{{ else }}projection{{ end }}.key" }
            - { name: NATS_NKEY_SEED_FILE, value: "/run/opencrane/files/{{ if $dispatcher }}dispatcher{{ else }}projection{{ end }}.seed" }
            - { name: NATS_INBOX_PREFIX, value: "_INBOX.{{ if $dispatcher }}dispatcher{{ else }}projection{{ end }}" }
            {{- if $memoryWriter }}
            {{- include "opencrane.memoryKeyEnvironment" . | nindent 12 }}
            {{- end }}
            - { name: MODEL_DECISION_URL, value: "http://server:43001" }
            {{- if $dispatcher }}
            - { name: KUBECONFIG, value: "/run/kubeconfig/config.json" }
            - name: KUBE_NAMESPACE
              valueFrom:
                fieldRef: { fieldPath: metadata.namespace }
            {{- end }}
          volumeMounts:
            - { name: runtime, mountPath: /run/opencrane, readOnly: true }
            - { name: runtime-files, mountPath: /run/opencrane/files, readOnly: true }
            {{- if $dispatcher }}
            - { name: kubeconfig, mountPath: /run/kubeconfig, readOnly: true }
            {{- end }}
            {{- if $memoryWriter }}
            - { name: memory-secrets, mountPath: /var/lib/opencrane/memory-secrets }
            {{- end }}
          resources:
            # Keep time for computer checks while reaction queues are busy.
            requests: { cpu: {{ ternary "100m" "20m" $dispatcher }}, memory: 64Mi }
            limits: { cpu: {{ ternary "1000m" "300m" $dispatcher }}, memory: 384Mi }
        {{- if $memoryReader }}
        {{- /* Stop the Memory projection with the other readers during an existing backup. */}}
        - name: memory
          image: {{ $root.Values.images.server | quote }}
          command: [node, infra/package/worker.mjs, memory]
          envFrom:
            - secretRef: { name: {{ $root.Values.secrets.runtime | quote }} }
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.secrets.runtime | quote }}
                  key: PROJECTION_DATABASE_URL
            - { name: NATS_CERT_FILE, value: /run/opencrane/files/projection.crt }
            - { name: NATS_KEY_FILE, value: /run/opencrane/files/projection.key }
            - { name: NATS_NKEY_SEED_FILE, value: /run/opencrane/files/projection.seed }
            - { name: NATS_INBOX_PREFIX, value: _INBOX.projection }
            {{- include "opencrane.memoryKeyEnvironment" . | nindent 12 }}
          volumeMounts:
            - { name: runtime, mountPath: /run/opencrane, readOnly: true }
            - { name: runtime-files, mountPath: /run/opencrane/files, readOnly: true }
            - { name: memory-secrets, mountPath: /var/lib/opencrane/memory-secrets, readOnly: true }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { cpu: 300m, memory: 384Mi }
        {{- end }}
      volumes:
        {{- if $memory }}
        {{- include "opencrane.memberKeyVolumes" (list "memory-secrets") | nindent 8 }}
        {{- end }}
        - name: runtime
          secret: { secretName: {{ $root.Values.secrets.runtime | quote }} }
        - name: runtime-files
          emptyDir: { medium: Memory }
        - name: runtime-file-source
          secret:
            secretName: {{ $root.Values.secrets.runtimeFiles | quote }}
            defaultMode: 256
        {{- if $dispatcher }}
        - name: kubeconfig
          emptyDir: { medium: Memory }
        {{- end }}
{{- end }}
