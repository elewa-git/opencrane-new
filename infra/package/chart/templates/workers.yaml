{{- $root := . -}}
{{- range $mode := list "members" "mcp-catalogue" "computers" "conversations" "files" "budgets" "audit" "dispatcher" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-{{ $mode }}
spec:
  replicas: 1
  selector:
    matchLabels: { app: worker-{{ $mode }} }
  template:
    metadata:
      labels: { app: worker-{{ $mode }} }
    spec:
      serviceAccountName: package-worker
      securityContext: { fsGroup: 1000 }
      initContainers:
        - name: kubeconfig
          image: {{ $root.Values.images.server | quote }}
          command: [node, infra/package/kubeconfig.mjs]
          volumeMounts:
            - { name: kubeconfig, mountPath: /run/kubeconfig }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 50m, memory: 64Mi }
        - name: wait-for-binding
          image: {{ $root.Values.images.server | quote }}
          command: [sh, -c, 'until [ "$(cat /run/opencrane/OPENFGA_STORE_ID)" != pending ]; do sleep 2; done']
          volumeMounts:
            - { name: runtime, mountPath: /run/opencrane, readOnly: true }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 50m, memory: 64Mi }
        - name: copy-private-files
          image: {{ $root.Values.images.server | quote }}
          command: [sh, -ec]
          args:
            - >-
              cp /run/opencrane-source/* /run/opencrane/files/ &&
              chown 1000:1000 /run/opencrane/files/* &&
              chmod 0400 /run/opencrane/files/*
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: runtime-file-source, mountPath: /run/opencrane-source, readOnly: true }
            - { name: runtime-files, mountPath: /run/opencrane/files }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 50m, memory: 64Mi }
      containers:
        - name: worker
          image: {{ $root.Values.images.server | quote }}
          command: [node, infra/package/worker.mjs, {{ $mode | quote }}]
          envFrom:
            - secretRef: { name: {{ $root.Values.secrets.runtime | quote }} }
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.secrets.runtime | quote }}
                  key: {{ if eq $mode "dispatcher" }}HANDLER_DATABASE_URL{{ else }}PROJECTION_DATABASE_URL{{ end }}
            {{- if eq $mode "dispatcher" }}
            - name: CONTENT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.secrets.runtime | quote }}
                  key: DATABASE_URL
            {{- end }}
            - { name: NATS_CERT_FILE, value: "/run/opencrane/files/{{ if eq $mode "dispatcher" }}dispatcher{{ else }}projection{{ end }}.crt" }
            - { name: NATS_KEY_FILE, value: "/run/opencrane/files/{{ if eq $mode "dispatcher" }}dispatcher{{ else }}projection{{ end }}.key" }
            - { name: NATS_NKEY_SEED_FILE, value: "/run/opencrane/files/{{ if eq $mode "dispatcher" }}dispatcher{{ else }}projection{{ end }}.seed" }
            - { name: NATS_INBOX_PREFIX, value: "_INBOX.{{ if eq $mode "dispatcher" }}dispatcher{{ else }}projection{{ end }}" }
            - { name: MODEL_DECISION_URL, value: "http://server:43001" }
            - { name: KUBECONFIG, value: "/run/kubeconfig/config.json" }
            - name: KUBE_NAMESPACE
              valueFrom:
                fieldRef: { fieldPath: metadata.namespace }
          volumeMounts:
            - { name: runtime, mountPath: /run/opencrane, readOnly: true }
            - { name: runtime-files, mountPath: /run/opencrane/files, readOnly: true }
            - { name: kubeconfig, mountPath: /run/kubeconfig, readOnly: true }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { cpu: 300m, memory: 384Mi }
      volumes:
        - name: runtime
          secret: { secretName: {{ $root.Values.secrets.runtime | quote }} }
        - name: runtime-files
          emptyDir: { medium: Memory }
        - name: runtime-file-source
          secret:
            secretName: {{ $root.Values.secrets.runtimeFiles | quote }}
            defaultMode: 256
        - name: kubeconfig
          emptyDir: { medium: Memory }
{{- end }}
