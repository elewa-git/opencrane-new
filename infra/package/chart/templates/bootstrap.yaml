apiVersion: v1
kind: ServiceAccount
metadata:
  name: package-bootstrap
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: package-bootstrap
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ .Values.secrets.runtime | quote }}]
    verbs: [get, patch]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [server, worker-members, worker-mcp-catalogue, worker-computers,
      worker-conversations, worker-files, worker-budgets, worker-audit,
      worker-dispatcher]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: package-bootstrap
subjects:
  - { kind: ServiceAccount, name: package-bootstrap }
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: package-bootstrap
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: package-projection
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: package-server
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: package-dispatcher
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: package-server
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/proxy]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create, get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: package-server
subjects:
  - { kind: ServiceAccount, name: package-server }
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: package-server
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: package-dispatcher
rules:
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: [sandboxclaims]
    verbs: [create, get]
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: [sandboxtemplates]
    verbs: [get]
  - apiGroups: ["agents.x-k8s.io"]
    resources: [sandboxes]
    verbs: [get, patch, update]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: package-dispatcher
subjects:
  - { kind: ServiceAccount, name: package-dispatcher }
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: package-dispatcher
{{- if not .Values.pilotRestore.enabled }}
{{- $bootstrapImage := default .Values.images.server .Values.bootstrapImage }}
{{- if not (regexMatch "@sha256:[a-f0-9]{64}$" $bootstrapImage) }}
{{- fail "bootstrap needs a pinned image" }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: bootstrap
spec:
  backoffLimit: 1
  template:
    spec:
      # Keep Kubernetes service variables from replacing the bootstrap's host port settings.
      enableServiceLinks: false
      serviceAccountName: package-bootstrap
      restartPolicy: Never
      securityContext: { fsGroup: 1000 }
      initContainers:
        - name: copy-private-files
          image: {{ $bootstrapImage | quote }}
          command: [sh, -ec]
          args:
            - >-
              cp /run/opencrane-source/* /run/opencrane/files/ &&
              chown 1000:1000 /run/opencrane/files/* &&
              chmod 0400 /run/opencrane/files/*
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: runtime-file-source, mountPath: /run/opencrane-source, readOnly: true }
            - { name: runtime-files, mountPath: /run/opencrane/files }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 50m, memory: 64Mi }
      containers:
        - name: bootstrap
          image: {{ $bootstrapImage | quote }}
          command: [node, --experimental-strip-types, infra/package/bootstrap.ts]
          envFrom:
            - secretRef: { name: {{ .Values.secrets.runtime | quote }} }
            - secretRef: { name: {{ .Values.secrets.bootstrap | quote }} }
          env:
            {{- if .Values.exposure.public.enabled }}
            - { name: DEV_OWNER_BOOTSTRAP, value: "0" }
            {{- end }}
            - { name: RUNTIME_SECRET, value: {{ .Values.secrets.runtime | quote }} }
            - name: KUBE_NAMESPACE
              valueFrom:
                fieldRef: { fieldPath: metadata.namespace }
          volumeMounts:
            - { name: runtime, mountPath: /run/opencrane, readOnly: true }
            - { name: runtime-files, mountPath: /run/opencrane/files, readOnly: true }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: runtime
          secret: { secretName: {{ .Values.secrets.runtime | quote }} }
        - name: runtime-files
          emptyDir: { medium: Memory }
        - name: runtime-file-source
          secret:
            secretName: {{ .Values.secrets.runtimeFiles | quote }}
            defaultMode: 256
{{- end }}
