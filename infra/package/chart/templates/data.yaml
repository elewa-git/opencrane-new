apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: conversation-keys
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 1Gi }
---
{{- if eq .Values.postgres.mode "cnpg" }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
spec:
  instances: 2
  imageName: {{ .Values.images.postgres | quote }}
{{- with .Values.postgres.backup }}
  backup:
    barmanObjectStore:
      destinationPath: {{ .destinationPath | quote }}
      endpointURL: {{ .endpointURL | quote }}
      endpointCA:
        name: {{ .endpointCA.name | quote }}
        key: {{ .endpointCA.key | quote }}
      s3Credentials:
        accessKeyId:
          name: {{ .s3Credentials.accessKeyId.name | quote }}
          key: {{ .s3Credentials.accessKeyId.key | quote }}
        secretAccessKey:
          name: {{ .s3Credentials.secretAccessKey.name | quote }}
          key: {{ .s3Credentials.secretAccessKey.key | quote }}
      data: { encryption: AES256 }
      wal: { encryption: AES256 }
{{- end }}
  enableSuperuserAccess: true
  superuserSecret: { name: {{ .Values.postgres.superuserSecret | quote }} }
  bootstrap:
    initdb:
      database: projections
      owner: projection
      secret: { name: {{ .Values.postgres.applicationSecret | quote }} }
  storage:
    size: 1Gi
    pvcTemplate:
      accessModes: [ReadWriteOnce]
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 384Mi }
{{- else }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: {{ required "postgres pin" .Values.images.postgres | quote }}
          envFrom:
            - secretRef: { name: {{ .Values.secrets.postgres | quote }} }
          ports: [{ containerPort: 5432 }]
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
          readinessProbe:
            exec:
              command: [pg_isready, -U, postgres]
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 384Mi }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 1Gi }
{{- end }}
{{- if not .Values.natsCluster.enabled }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
spec:
  serviceName: nats
  replicas: 1
  selector:
    matchLabels: { app: nats }
  template:
    metadata:
      labels: { app: nats }
    spec:
      securityContext: { fsGroup: 1000 }
      containers:
        - name: nats
          image: {{ required "nats pin" .Values.images.nats | quote }}
          args: [-c, /etc/nats/nats.conf]
          envFrom:
            - secretRef: { name: {{ .Values.secrets.nats | quote }} }
          ports: [{ containerPort: 4222 }]
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: settings, mountPath: /etc/nats, readOnly: true }
            - { name: settings, mountPath: /tls, readOnly: true }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
      volumes:
        - name: settings
          secret: { secretName: {{ .Values.secrets.nats | quote }} }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 1Gi }
{{- end }}
