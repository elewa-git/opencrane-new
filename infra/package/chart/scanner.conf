Foreground yes
TCPSocket 3310
TCPAddr 127.0.0.1
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
SelfCheck 0
ConcurrentDatabaseReload no
StreamMaxLength 21M
MaxFileSize 21M
MaxScanSize 80M
MaxRecursion 16
MaxFiles 2000
AlertExceedsMax yes
AlertEncrypted yes
ReadTimeout 60
CommandReadTimeout 10
