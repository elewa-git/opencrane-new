# Keep client TLS and account permissions identical to the single-server configuration.
include nats.conf
server_name: $NATS_SERVER_NAME

cluster {
  name: $NATS_CLUSTER_NAME
  listen: $NATS_ROUTE_LISTEN
  advertise: $NATS_ROUTE_ADVERTISE
  routes: [$NATS_ROUTE_1, $NATS_ROUTE_2]
  tls {
    cert_file: $NATS_ROUTE_CERT_FILE
    key_file: $NATS_ROUTE_KEY_FILE
    # Trust only the route issuer, never the issuer of ordinary client certificates.
    ca_file: $NATS_ROUTE_CA_FILE
    verify_cert_and_check_known_urls: true
    min_version: "1.2"
  }
}
