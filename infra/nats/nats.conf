# Mount short-lived certificates from the secret store; never put PEM values here.
listen: $NATS_LISTEN
jetstream { store_dir: $NATS_STORE_DIR }
tls {
  cert_file: $NATS_CERT_FILE
  key_file: $NATS_KEY_FILE
  ca_file: $NATS_CA_FILE
  verify_and_map: true
  handshake_first: true
  min_version: "1.2"
}

reader = {
  publish: [
    "$JS.API.INFO",
    "$JS.API.STREAM.INFO.EVENTS",
    "$JS.API.STREAM.MSG.GET.EVENTS",
    "$JS.API.CONSUMER.CREATE.EVENTS", "$JS.API.CONSUMER.CREATE.EVENTS.>",
    "$JS.API.CONSUMER.DURABLE.CREATE.EVENTS.>",
    "$JS.API.CONSUMER.INFO.EVENTS.>",
    "$JS.API.CONSUMER.DELETE.EVENTS.>",
    "$JS.API.CONSUMER.MSG.NEXT.EVENTS.>",
    "$JS.ACK.EVENTS.>"
  ]
  subscribe: ["_INBOX.>"]
}
accounts {
  EVENT_CORE {
    jetstream: enabled
    users: [
      {
        user: "CN=command"
        permissions: {
          publish: [
            "ev.>", "$JS.API.INFO", "$JS.API.STREAM.*.EVENTS",
            "$JS.API.DIRECT.GET.EVENTS", "$JS.API.DIRECT.GET.EVENTS.>",
            "$JS.API.STREAM.MSG.GET.EVENTS",
            "$JS.API.CONSUMER.CREATE.EVENTS", "$JS.API.CONSUMER.CREATE.EVENTS.>",
            "$JS.API.CONSUMER.DURABLE.CREATE.EVENTS.>",
            "$JS.API.CONSUMER.INFO.EVENTS.>",
            "$JS.API.CONSUMER.DELETE.EVENTS.>",
            "$JS.API.CONSUMER.MSG.NEXT.EVENTS.>",
            "$JS.ACK.EVENTS.>", "$JS.SNAPSHOT.ACK.EVENTS.>",
            "$JS.SNAPSHOT.RESTORE.EVENTS.>"
          ]
          subscribe: ["_INBOX.>"]
        }
      },
      { user: "CN=projection", permissions: $reader },
      { user: "CN=dispatcher", permissions: $reader }
    ]
  }
  # No imports, exports or JetStream: these identities cannot reach EVENT_CORE.
  EXCLUDED {
    users: [
      { user: "CN=computer", permissions: { publish: { deny: [">"] }, subscribe: { deny: [">"] } } },
      { user: "CN=gateway", permissions: { publish: { deny: [">"] }, subscribe: { deny: [">"] } } }
    ]
  }
}
