# Mount certificates and role NKey seeds from the secret store. Only public NKeys go here.
listen: $NATS_LISTEN
jetstream { store_dir: $NATS_STORE_DIR }
tls {
  cert_file: $NATS_CERT_FILE
  key_file: $NATS_KEY_FILE
  ca_file: $NATS_CA_FILE
  verify: true
  handshake_first: true
  min_version: "1.2"
}

accounts {
  EVENT_CORE {
    jetstream: enabled
    exports: [
      { service: "$JS.API.STREAM.MSG.GET.EVENTS", accounts: [PROJECTION, DISPATCHER] }
      { service: "$JS.API.STREAM.INFO.EVENTS", accounts: [PROJECTION, DISPATCHER] }
      { service: "$JS.API.INFO", accounts: [PROJECTION, DISPATCHER] }
      { service: "$JS.API.CONSUMER.INFO.EVENTS.projection-members", accounts: [PROJECTION] }
      { service: "$JS.API.CONSUMER.MSG.NEXT.EVENTS.projection-members", accounts: [PROJECTION], response_type: stream }
      { service: "$JS.API.CONSUMER.INFO.EVENTS.projection-authz", accounts: [PROJECTION] }
      { service: "$JS.API.CONSUMER.MSG.NEXT.EVENTS.projection-authz", accounts: [PROJECTION], response_type: stream }
      { service: "$JS.API.CONSUMER.INFO.EVENTS.projection-replay", accounts: [PROJECTION] }
      { service: "$JS.API.CONSUMER.MSG.NEXT.EVENTS.projection-replay", accounts: [PROJECTION], response_type: stream }
      { service: "$JS.API.CONSUMER.INFO.EVENTS.handler-dispatcher", accounts: [DISPATCHER] }
      { service: "$JS.API.CONSUMER.MSG.NEXT.EVENTS.handler-dispatcher", accounts: [DISPATCHER], response_type: stream }
      { service: "$JS.ACK.EVENTS.handler-dispatcher.>", accounts: [DISPATCHER] }
    ]
    users: [
      {
        nkey: $NATS_COMMAND_NKEY
        permissions: {
          publish: [
            "ev.>", "$JS.API.INFO", "$JS.API.STREAM.*.EVENTS",
            "$JS.API.DIRECT.GET.EVENTS", "$JS.API.DIRECT.GET.EVENTS.>",
            "$JS.API.STREAM.MSG.GET.EVENTS",
            "$JS.API.CONSUMER.CREATE.EVENTS", "$JS.API.CONSUMER.CREATE.EVENTS.>",
            "$JS.API.CONSUMER.DURABLE.CREATE.EVENTS.>",
            "$JS.API.CONSUMER.INFO.EVENTS.>",
            "$JS.API.CONSUMER.DELETE.EVENTS.>",
            "$JS.API.CONSUMER.MSG.NEXT.EVENTS.>",
            "$JS.ACK.EVENTS.>", "$JS.SNAPSHOT.ACK.EVENTS.>",
            "$JS.SNAPSHOT.RESTORE.EVENTS.>"
          ]
          subscribe: ["_INBOX.>"]
        }
      }
    ]
  }
  PROJECTION {
    imports: [
      { service: { account: EVENT_CORE, subject: "$JS.API.INFO" } }
      { service: { account: EVENT_CORE, subject: "$JS.API.STREAM.INFO.EVENTS" } }
      { service: { account: EVENT_CORE, subject: "$JS.API.STREAM.MSG.GET.EVENTS" } }
      { service: { account: EVENT_CORE, subject: "$JS.API.CONSUMER.INFO.EVENTS.projection-members" } }
      { service: { account: EVENT_CORE, subject: "$JS.API.CONSUMER.MSG.NEXT.EVENTS.projection-members" } }
      { service: { account: EVENT_CORE, subject: "$JS.API.CONSUMER.INFO.EVENTS.projection-authz" } }
      { service: { account: EVENT_CORE, subject: "$JS.API.CONSUMER.MSG.NEXT.EVENTS.projection-authz" } }
      { service: { account: EVENT_CORE, subject: "$JS.API.CONSUMER.INFO.EVENTS.projection-replay" } }
      { service: { account: EVENT_CORE, subject: "$JS.API.CONSUMER.MSG.NEXT.EVENTS.projection-replay" } }
    ]
    users: [{ nkey: $NATS_PROJECTION_NKEY, permissions: {
      publish: [
        "$JS.API.INFO"
        "$JS.API.STREAM.INFO.EVENTS"
        "$JS.API.STREAM.MSG.GET.EVENTS"
        "$JS.API.CONSUMER.INFO.EVENTS.projection-members"
        "$JS.API.CONSUMER.MSG.NEXT.EVENTS.projection-members"
        "$JS.API.CONSUMER.INFO.EVENTS.projection-authz"
        "$JS.API.CONSUMER.MSG.NEXT.EVENTS.projection-authz"
        "$JS.API.CONSUMER.INFO.EVENTS.projection-replay"
        "$JS.API.CONSUMER.MSG.NEXT.EVENTS.projection-replay"
      ]
      subscribe: ["_INBOX.projection.>"]
    } }]
  }
  DISPATCHER {
    imports: [
      { service: { account: EVENT_CORE, subject: "$JS.API.INFO" } }
      { service: { account: EVENT_CORE, subject: "$JS.API.STREAM.INFO.EVENTS" } }
      { service: { account: EVENT_CORE, subject: "$JS.API.STREAM.MSG.GET.EVENTS" } }
      { service: { account: EVENT_CORE, subject: "$JS.API.CONSUMER.INFO.EVENTS.handler-dispatcher" } }
      { service: { account: EVENT_CORE, subject: "$JS.API.CONSUMER.MSG.NEXT.EVENTS.handler-dispatcher" } }
      { service: { account: EVENT_CORE, subject: "$JS.ACK.EVENTS.handler-dispatcher.>" } }
    ]
    users: [{ nkey: $NATS_DISPATCHER_NKEY, permissions: {
      publish: [
        "$JS.API.INFO"
        "$JS.API.STREAM.INFO.EVENTS"
        "$JS.API.STREAM.MSG.GET.EVENTS"
        "$JS.API.CONSUMER.INFO.EVENTS.handler-dispatcher"
        "$JS.API.CONSUMER.MSG.NEXT.EVENTS.handler-dispatcher"
        "$JS.ACK.EVENTS.handler-dispatcher.>"
      ]
      subscribe: ["_INBOX.dispatcher.>"]
    } }]
  }
  # No imports, exports or JetStream: these identities cannot reach EVENT_CORE.
  EXCLUDED {
    users: [
      { nkey: $NATS_COMPUTER_NKEY, permissions: { publish: { deny: [">"] }, subscribe: { deny: [">"] } } },
      { nkey: $NATS_GATEWAY_NKEY, permissions: { publish: { deny: [">"] }, subscribe: { deny: [">"] } } }
    ]
  }
}
